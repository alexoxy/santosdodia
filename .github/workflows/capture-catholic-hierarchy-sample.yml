name: Capture Catholic-Hierarchy parser sample

on:
  push:
    branches:
      - agent/global-leaders-directory
    paths:
      - '.github/workflows/capture-catholic-hierarchy-sample.yml'

permissions:
  contents: read
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Capture Portugal source pages privately
        run: npm run leaders:sync -- --source=catholic-hierarchy --country=pt --max-countries=1 --retain-html

      - name: Upload private diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: catholic-hierarchy-portugal-parser-sample
          path: data/generated/ecclesiastical-directory/snapshots/catholic-hierarchy/
          if-no-files-found: error
          retention-days: 30

      - name: Record diagnostic run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `Parser diagnostic artifact created privately in workflow run ${context.runId}; it is retained for 30 days and is not committed to the repository.`
            })
