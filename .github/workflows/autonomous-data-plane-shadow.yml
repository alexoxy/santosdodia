name: Autonomous data plane shadow

on:
  schedule:
    - cron: '47 2 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-data-plane-shadow
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate autonomy and repository policy
        run: |
          npm run autonomy:test
          npm run automation:audit
          npm run osint:registry-audit
          npm run cloudflare:guardrails-audit
          npm run repo:audit

      - name: Run autonomous acquisition and normalization cycle
        env:
          OSINT_WIKIDATA_PAGE_SIZE: '500'
          OSINT_WIKIDATA_MAX_PAGES: '1'
        run: npm run autonomy:run -- --output staging/autonomous-data-plane

      - name: Upload autonomous cycle evidence
        uses: actions/upload-artifact@v6
        with:
          name: autonomous-data-plane-${{ github.run_id }}
          path: staging/autonomous-data-plane/
          if-no-files-found: error
          retention-days: 30

      - name: Archive autonomous cycle in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/archive-to-dropbox.mjs --stream autonomous-data-plane --source staging/autonomous-data-plane
