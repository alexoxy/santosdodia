name: Validate global leaders delivery

on:
  push:
    branches:
      - agent/global-leaders-directory
    paths-ignore:
      - 'data/generated/branch-validation/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-global-leaders-delivery
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run product quality gate
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run cloudflare:build

      - name: Record successful validation in issue 10
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `✅ Global leaders branch validation passed for \`${context.sha}\`: dependency audit, editorial/data/API audits, TypeScript, lint, Next.js build and Cloudflare/OpenNext build.`
            })
