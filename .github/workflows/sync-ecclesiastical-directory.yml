name: Sync ecclesiastical directory

on:
  workflow_dispatch:
    inputs:
      source:
        description: Registered source adapter
        required: true
        type: choice
        default: catholic-hierarchy
        options:
          - catholic-hierarchy
          - gcatholic
          - orthodoxia-fribourg
          - anglican-communion
          - oca-world-churches
          - goarch-directory
          - coptic-orthodox-dioceses
          - mother-see-dioceses
          - ethiopian-orthodox-directory
          - syriac-orthodox-patriarchate
      country:
        description: Optional comma-separated Catholic-Hierarchy country codes
        required: false
        type: string
      max_countries:
        description: Safety limit; 0 means all selected countries
        required: true
        default: '5'
        type: string
      retain_html:
        description: Retain compressed source pages as a private workflow artifact
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ecclesiastical-directory-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  sync-audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate source registry
        run: npm run leaders:audit

      - name: Synchronize selected source
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          COUNTRY: ${{ inputs.country }}
          MAX_COUNTRIES: ${{ inputs.max_countries }}
          RETAIN_HTML: ${{ inputs.retain_html }}
        run: |
          args=("--source=${SOURCE}" "--max-countries=${MAX_COUNTRIES}")
          if [ -n "${COUNTRY}" ]; then args+=("--country=${COUNTRY}"); fi
          if [ "${RETAIN_HTML}" = "true" ]; then args+=("--retain-html"); fi
          npm run leaders:sync -- "${args[@]}"

      - name: Audit imported records
        run: npm run leaders:audit

      - name: Build transactional staging SQL
        run: npm run leaders:sql

      - name: Validate repository
        run: npm run check

      - name: Upload retained source snapshots
        if: ${{ inputs.retain_html }}
        uses: actions/upload-artifact@v4
        with:
          name: ecclesiastical-source-snapshots-${{ inputs.source }}-${{ github.run_id }}
          path: data/generated/ecclesiastical-directory/snapshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit normalized source data
        shell: bash
        run: |
          git config user.name 'santosdodia-directory-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/generated/ecclesiastical-directory/*.json db/seeds/ecclesiastical-directory.sql
          if git diff --cached --quiet; then
            echo 'No normalized directory changes.'
            exit 0
          fi
          git commit -m "data(leaders): refresh ${{ inputs.source }} directory"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Generated directory conflicts with newer main changes; refusing automatic resolution.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo 'Unable to publish normalized directory data after three attempts.'
          exit 1
