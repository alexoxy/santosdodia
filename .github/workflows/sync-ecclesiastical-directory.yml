name: Prepare ecclesiastical directory ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: Registered source adapter
        required: true
        type: choice
        default: catholic-hierarchy
        options:
          - catholic-hierarchy
          - gcatholic
          - orthodoxia-fribourg
          - anglican-communion
          - oca-world-churches
          - goarch-directory
          - coptic-orthodox-dioceses
          - mother-see-dioceses
          - ethiopian-orthodox-directory
          - syriac-orthodox-patriarchate
      country:
        description: Optional comma-separated Catholic-Hierarchy country codes
        required: false
        type: string
      max_countries:
        description: Safety limit; 0 means all selected countries
        required: true
        default: '5'
        type: string
      retain_html:
        description: Include compressed source pages in the private staging artifact
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ecclesiastical-directory-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  prepare-audited-staging-package:
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate source registry
        run: npm run leaders:audit

      - name: Synchronize selected source
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          COUNTRY: ${{ inputs.country }}
          MAX_COUNTRIES: ${{ inputs.max_countries }}
          RETAIN_HTML: ${{ inputs.retain_html }}
        run: |
          args=("--source=${SOURCE}" "--max-countries=${MAX_COUNTRIES}")
          if [ -n "${COUNTRY}" ]; then args+=("--country=${COUNTRY}"); fi
          if [ "${RETAIN_HTML}" = "true" ]; then args+=("--retain-html"); fi
          npm run leaders:sync -- "${args[@]}"

      - name: Audit imported records
        run: npm run leaders:audit

      - name: Build transactional staging SQL
        run: npm run leaders:sql

      - name: Validate repository
        run: npm run check

      - name: Build staging manifest
        shell: bash
        run: |
          mkdir -p data/generated/ecclesiastical-directory/staging
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = 'data/generated/ecclesiastical-directory';
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name);
              const stat = fs.statSync(full);
              if (stat.isDirectory()) walk(full);
              else if (!full.endsWith('/staging/manifest.json')) {
                const body = fs.readFileSync(full);
                files.push({
                  path: full,
                  bytes: body.length,
                  sha256: crypto.createHash('sha256').update(body).digest('hex')
                });
              }
            }
          }
          walk(root);
          if (fs.existsSync('db/seeds/ecclesiastical-directory.sql')) {
            const full = 'db/seeds/ecclesiastical-directory.sql';
            const body = fs.readFileSync(full);
            files.push({path: full, bytes: body.length, sha256: crypto.createHash('sha256').update(body).digest('hex')});
          }
          const manifest = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            source: process.env.SOURCE,
            country: process.env.COUNTRY || null,
            maxCountries: process.env.MAX_COUNTRIES,
            destinationPolicy: 'Dropbox staging before database promotion',
            dropboxRoot: `/archive/ecclesiastical-directory/${process.env.SOURCE}`,
            publicationAllowed: false,
            files
          };
          fs.writeFileSync(path.join(root, 'staging', 'manifest.json'), JSON.stringify(manifest, null, 2) + '\n');
          NODE
        env:
          SOURCE: ${{ inputs.source }}
          COUNTRY: ${{ inputs.country }}
          MAX_COUNTRIES: ${{ inputs.max_countries }}

      - name: Upload audited staging package
        uses: actions/upload-artifact@v7
        with:
          name: ecclesiastical-staging-${{ inputs.source }}-${{ github.run_id }}
          path: |
            data/generated/ecclesiastical-directory/
            db/seeds/ecclesiastical-directory.sql
            db/migrations/0001_ecclesiastical_directory.sql
            docs/data-staging-policy.md
          if-no-files-found: error
          retention-days: 30

      - name: Archive audited staging package in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream ecclesiastical-directory/${{ inputs.source }}
          --source data/generated/ecclesiastical-directory
          --source db/seeds/ecclesiastical-directory.sql
          --source db/migrations/0001_ecclesiastical_directory.sql
          --source docs/data-staging-policy.md

      - name: Explain promotion boundary
        run: |
          echo 'This workflow does not commit generated data and does not publish to the site.'
          echo 'The artifact is archived and validated under /archive/ecclesiastical-directory in the Dropbox App Folder.'
          echo 'A separate controlled operation promotes approved records into the site database.'
