name: Prepare LitCal staging package

# External data is never published directly. This workflow prepares a bounded,
# validated artifact for Dropbox staging, editorial review and later DB promotion.
on:
  schedule:
    - cron: '35 3 18 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-litcal-mirror.mjs'
      - 'scripts/mirror-litcal-source.sh'
      - 'scripts/sync-name-translations.mjs'
      - 'scripts/calendar/audit-litcal-daily-coverage.mjs'
      - 'scripts/calendar/test-litcal-daily-coverage.mjs'
      - 'scripts/validate-language-quality.mjs'
      - 'scripts/audit-languagetool.mjs'
      - 'scripts/audit-data-quality.mjs'
      - 'scripts/audit-claim-evidence.mjs'
      - 'scripts/audit-repository-hygiene.mjs'
      - 'data/language-authorities.json'
      - 'data/editorial-claim-evidence.json'
      - 'lib/language-quality.ts'
      - 'lib/locale-display.ts'
      - '.github/workflows/update-litcal-mirror.yml'

permissions:
  contents: read

concurrency:
  group: litcal-staging-package
  cancel-in-progress: false

jobs:
  prepare-validate-and-package:
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out SantosDia
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Audit repository hygiene
        run: npm run repo:audit

      - name: Record compact upstream provenance
        run: npm run litcal:source

      - name: Prepare structured LitCal responses
        env:
          LITCAL_MIN_AVAILABLE_RATIO: '0.8'
        run: npm run litcal:sync

      - name: Enforce complete civil-day liturgy coverage
        run: |
          node scripts/calendar/test-litcal-daily-coverage.mjs
          node scripts/calendar/audit-litcal-daily-coverage.mjs \
            --output data/generated/litcal-daily-coverage.json

      - name: Build multilingual observance catalogue
        env:
          MAX_WIKIDATA_LOOKUPS: '150'
        run: npm run translations:sync

      - name: Enforce script and vocabulary rules
        run: npm run translations:validate

      - name: Audit curated data and generated snapshot schema
        run: npm run data:audit

      - name: Audit claim-specific editorial evidence
        run: npm run claims:audit

      - name: Run advisory grammar and spelling audit
        continue-on-error: true
        env:
          LANGUAGE_TOOL_URL: https://api.languagetool.org/v2/check
        run: npm run translations:grammar

      - name: Validate production application
        run: npm run build

      - name: Create staging manifest
        shell: bash
        run: |
          cat > data/generated/litcal-staging-manifest.json <<EOF
          {
            "schemaVersion": 1,
            "workflowRun": "${GITHUB_RUN_ID}",
            "sourceCommit": "${GITHUB_SHA}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "provisional",
            "promotionAllowed": false,
            "dailyCoverageGate": "passed",
            "nextGate": "Dropbox archive, language readiness, normalization review and transactional database promotion"
          }
          EOF

      - name: Upload bounded staging package
        uses: actions/upload-artifact@v7
        with:
          name: litcal-staging-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            data/litcal-mirror/
            data/generated/litcal-daily-coverage.json
            data/generated/translation-catalog.json
            data/generated/translation-quality.json
            data/generated/languagetool-audit.json
            data/generated/litcal-staging-manifest.json

      - name: Archive bounded staging package in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream litcal
          --source data/litcal-mirror
          --source data/generated/litcal-daily-coverage.json
          --source data/generated/translation-catalog.json
          --source data/generated/translation-quality.json
          --source data/generated/languagetool-audit.json
          --source data/generated/litcal-staging-manifest.json
