name: Temporary validate Sanctorale batch 4

on:
  push:
    branches:
      - migration/sanctorale-doctors-review-4-20260831
    paths:
      - '.github/workflows/tmp-validate-sanctorale-batch-4.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-doctors-review-4-20260831
      - name: Validate reviewed packs
        run: node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-validate-sanctorale-batch-4.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-validate-sanctorale-batch-4.yml
          git commit -m 'Remove temporary batch 4 validation workflow'
          git push origin HEAD:migration/sanctorale-doctors-review-4-20260831
