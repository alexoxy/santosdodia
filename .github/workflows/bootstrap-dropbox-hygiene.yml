name: Bootstrap complete Dropbox archive coverage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-dropbox-hygiene.yml
      - scripts/prepare-dropbox-hygiene-bootstrap.mjs

permissions:
  contents: write

concurrency:
  group: bootstrap-dropbox-hygiene
  cancel-in-progress: false

jobs:
  archive-all-missing-streams:
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate archive, editorial and automation gates
        run: |
          npm run dropbox:archive-test
          npm run data:audit
          npm run claims:audit
          npm run osint:normalize-test
          npm run leaders:audit
          npm run automation:audit

      - name: Prepare non-public hygiene packages
        run: node scripts/prepare-dropbox-hygiene-bootstrap.mjs staging/dropbox-hygiene

      - name: Build bounded source-freshness report
        run: >-
          npm run sources:freshness --
          --network
          --max-urls 60
          --output staging/dropbox-hygiene/source-freshness/report.json

      - name: Archive missing streams with verified receipts
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          node scripts/archive-to-dropbox.mjs --stream observances --source staging/dropbox-hygiene/observances
          node scripts/archive-to-dropbox.mjs --stream wikidata-normalized --source staging/dropbox-hygiene/wikidata-normalized
          node scripts/archive-to-dropbox.mjs --stream ecclesiastical-directory/foundation --source staging/dropbox-hygiene/ecclesiastical-directory-foundation
          node scripts/archive-to-dropbox.mjs --stream source-freshness --source staging/dropbox-hygiene/source-freshness

      - name: Retire reviewed obsolete branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/retire-reviewed-obsolete-branches.mjs

      - name: Preserve bootstrap evidence for troubleshooting
        uses: actions/upload-artifact@v6
        with:
          name: dropbox-hygiene-bootstrap-${{ github.run_id }}
          path: staging/dropbox-hygiene/
          if-no-files-found: error
          retention-days: 7
