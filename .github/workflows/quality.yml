name: Quality

on:
  push:
    branches:
      - main
      - vercel-preview
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Vercel deployment policy
        run: |
          node <<'NODE'
          const config = require('./vercel.json');
          const deployment = config.git?.deploymentEnabled;
          const expected = { '*': false, main: true, 'vercel-preview': true };
          const actualKeys = Object.keys(deployment ?? {}).sort();
          const expectedKeys = Object.keys(expected).sort();
          if (JSON.stringify(actualKeys) !== JSON.stringify(expectedKeys)) {
            throw new Error(`Unexpected Vercel deployment branches: ${actualKeys.join(', ')}`);
          }
          for (const [branch, value] of Object.entries(expected)) {
            if (deployment[branch] !== value) {
              throw new Error(`Vercel deployment policy mismatch for ${branch}`);
            }
          }
          console.log('Vercel deployments are limited to main and vercel-preview.');
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Production smoke test
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/santosdodia-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT

          for attempt in {1..30}; do
            http_code="$(curl --silent --show-error --output /tmp/santosdodia-status.json --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/system/status || true)"

            if [ "$http_code" = "000" ]; then
              sleep 1
              continue
            fi

            echo "Health endpoint returned HTTP ${http_code}:"
            cat /tmp/santosdodia-status.json || true
            echo

            if [ "$http_code" = "200" ] && node -e "const body=JSON.parse(require('node:fs').readFileSync('/tmp/santosdodia-status.json','utf8')); if(body.status!=='ok') process.exit(1)"; then
              exit 0
            fi

            echo "Application health check did not pass."
            cat /tmp/santosdodia-next.log || true
            exit 1
          done

          echo "Application did not become reachable within 30 seconds."
          cat /tmp/santosdodia-next.log || true
          exit 1
