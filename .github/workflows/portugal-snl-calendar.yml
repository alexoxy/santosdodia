name: Portugal SNL calendar staging

on:
  workflow_run:
    workflows: ['Prepare LitCal staging package']
    types: [completed]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/calendar/fetch-portugal-snl-agenda.mjs'
      - 'scripts/calendar/normalize-portugal-snl-agenda.mjs'
      - 'scripts/calendar/reconcile-portugal-snl.mjs'
      - 'scripts/calendar/build-portugal-snl-review-bundle.mjs'
      - 'scripts/calendar/test-portugal-snl-agenda.mjs'
      - 'scripts/calendar/test-portugal-snl-reconciliation.mjs'
      - 'scripts/calendar/test-portugal-snl-review-bundle.mjs'
      - '.github/workflows/portugal-snl-calendar.yml'
      - 'config/automation-registry.json'

permissions:
  contents: read

concurrency:
  group: portugal-snl-calendar-staging
  cancel-in-progress: false

jobs:
  stage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate Portugal calendar and review boundaries
        run: |
          node scripts/calendar/test-portugal-snl-agenda.mjs
          node scripts/calendar/test-portugal-snl-reconciliation.mjs
          node scripts/calendar/test-portugal-snl-review-bundle.mjs
          npm run automation:audit

      - name: Fetch official SNL subscription feed
        run: node scripts/calendar/fetch-portugal-snl-agenda.mjs --output-dir staging/portugal-snl

      - name: Normalize Portugal jurisdiction layer
        run: node scripts/calendar/normalize-portugal-snl-agenda.mjs --input-dir staging/portugal-snl --output staging/portugal-snl/normalized-package.json

      - name: Reconcile SNL events against General Roman reference
        run: >-
          node scripts/calendar/reconcile-portugal-snl.mjs
          --snl staging/portugal-snl/normalized-package.json
          --mirror-root data/litcal-mirror/calendars/general
          --output staging/portugal-snl/reconciliation.json

      - name: Build compact human-review queues
        run: >-
          node scripts/calendar/build-portugal-snl-review-bundle.mjs
          --normalized staging/portugal-snl/normalized-package.json
          --reconciliation staging/portugal-snl/reconciliation.json
          --output-dir staging/portugal-snl/review

      - name: Validate canonical calendar staging contract
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum staging/portugal-snl/source-manifest.json | awk '{print $1}')"
          node scripts/normalize-calendar-staging-package.mjs \
            --input staging/portugal-snl/normalized-package.json \
            --output staging/portugal-snl/canonical-staging.json \
            --manifest-sha256 "$manifest_sha"
          node <<'NODE'
          const fs=require('node:fs');
          const normalized=JSON.parse(fs.readFileSync('staging/portugal-snl/normalized-package.json','utf8'));
          const canonical=JSON.parse(fs.readFileSync('staging/portugal-snl/canonical-staging.json','utf8'));
          const reconciliation=JSON.parse(fs.readFileSync('staging/portugal-snl/reconciliation.json','utf8'));
          const review=JSON.parse(fs.readFileSync('staging/portugal-snl/review/review-bundle.json','utf8'));
          if(normalized.run.publicationAllowed!==false||normalized.run.promotionAllowed!==false) throw new Error('Portugal layer escaped staging-only mode.');
          if(normalized.coverage.sourceDayCount<365||normalized.coverage.civilDays<365) throw new Error(`Portugal SNL coverage unexpectedly thin: ${JSON.stringify(normalized.coverage)}`);
          if(canonical.occurrences.some(item=>item.jurisdictionId!=='PT'||item.churchId!=='roman-catholic'||item.publicationStatus!=='withheld')) throw new Error('Portugal canonical staging output crossed jurisdiction/publication boundary.');
          if(reconciliation.mode!=='proposal-only'||reconciliation.productionWriteAllowed!==false||reconciliation.automaticLinkAllowed!==false) throw new Error('Portugal reconciler crossed proposal-only boundary.');
          if(reconciliation.summary.inputOccurrences!==normalized.events.length||reconciliation.items.length!==normalized.events.length) throw new Error('Portugal reconciliation does not partition all SNL observances.');
          if(reconciliation.items.some(item=>item.reviewRequired!==true||item.automaticLinkAllowed!==false)) throw new Error('Portugal reconciliation produced an unreviewed automatic link.');
          if(review.mode!=='human-review-by-exception'||review.productionWriteAllowed!==false||review.summary.inputOccurrences!==normalized.events.length) throw new Error('Portugal review bundle crossed review-only boundary.');
          if(Object.values(review.queues).flat().some(item=>item.decision!=='pending-human-review'||item.productionWriteAllowed!==false)) throw new Error('Portugal review bundle contains an implicitly approved item.');
          NODE

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: portugal-snl-calendar-${{ github.run_id }}
          path: staging/portugal-snl/
          if-no-files-found: error
          retention-days: 14

      - name: Archive immutable Portugal calendar package in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/archive-to-dropbox.mjs --stream calendar/portugal-snl/v1 --source staging/portugal-snl
