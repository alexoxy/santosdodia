name: Classify publication candidates

on:
  workflow_run:
    workflows: ['Autonomous linguistic review']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classify-publication-candidates-saints-wikidata
  cancel-in-progress: false

jobs:
  classify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate autonomy and publication boundaries
        run: |
          npm run autonomy:test
          npm run autonomy:lanes-audit
          npm run linguistic:audit
          node -e "const p=require('./config/publication-decision-policy.json'); if(p.productionAutoPromotionEnabled!==false||p.mode!=='shadow-classification') process.exit(1)"

      - name: Pull latest verified reviewed partition from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: npm run dropbox:pull-stream -- --stream osint-reviewed/saints/wikidata --destination staging/dropbox-intake/osint-reviewed/saints/wikidata

      - name: Validate and extract reviewed package
        shell: bash
        run: |
          set -euo pipefail
          archive='staging/dropbox-intake/osint-reviewed/saints/wikidata/package.tar.gz'
          destination='staging/dropbox-intake/osint-reviewed/saints/wikidata/extracted'
          mkdir -p "$destination"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const archive = 'staging/dropbox-intake/osint-reviewed/saints/wikidata/package.tar.gz';
          const listing = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' });
          for (const entry of listing.split(/\r?\n/).filter(Boolean)) {
            if (entry.startsWith('/') || entry.split('/').includes('..')) throw new Error(`Unsafe archive entry: ${entry}`);
          }
          NODE
          tar -xzf "$archive" -C "$destination" --no-same-owner --no-same-permissions

      - name: Classify claims into autonomy lanes
        run: |
          node scripts/autonomy/classify-publication-candidates.mjs \
            --input staging/dropbox-intake/osint-reviewed/saints/wikidata/extracted/staging/osint-reviewed/saints/wikidata \
            --output staging/publication-decisions/saints/wikidata
          cp staging/dropbox-intake/osint-reviewed/saints/wikidata/consumer-receipt.json \
            staging/publication-decisions/saints/wikidata/upstream-reviewed-receipt.json

      - name: Verify shadow mode and queue integrity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'staging/publication-decisions/saints/wikidata';
          const report = JSON.parse(fs.readFileSync(`${base}/publication-decisions.json`, 'utf8'));
          const auto = JSON.parse(fs.readFileSync(`${base}/auto-eligible-shadow.json`, 'utf8'));
          const receipt = JSON.parse(fs.readFileSync(`${base}/upstream-reviewed-receipt.json`, 'utf8'));
          if (report.productionAutoPromotionEnabled !== false || report.mode !== 'shadow-classification') throw new Error('Classifier escaped shadow mode.');
          if (auto.productionWriteAllowed !== false) throw new Error('Auto-eligible shadow queue must not authorize production writes.');
          if (receipt.verified !== true) throw new Error('Classifier did not consume a verified Dropbox package.');
          if (!Number.isInteger(report.summary?.entities) || report.summary.entities < 1) throw new Error('Publication classifier produced no entity decisions.');
          NODE

      - name: Upload publication decision evidence
        uses: actions/upload-artifact@v7
        with:
          name: publication-decisions-saints-wikidata-${{ github.run_id }}
          path: staging/publication-decisions/saints/wikidata/
          if-no-files-found: error
          retention-days: 30

      - name: Archive review-by-exception queues in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/archive-to-dropbox.mjs --stream publication-decisions/saints/wikidata --source staging/publication-decisions/saints/wikidata
