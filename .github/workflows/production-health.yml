name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-health.yml'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_USER_AGENT: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36 SantosDiaHealth/1.0
    steps:
      - name: Check canonical homepage and Cloudflare response
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"

          curl --silent --show-error --fail --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --header 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
            --retry 3 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" \
            https://www.santosdodia.com/

          grep -qi '^cf-ray:' "$headers" || {
            echo 'Expected Cloudflare cf-ray response header was not present.'
            cat "$headers"
            exit 1
          }

          test -s "$body" || {
            echo 'Homepage returned an empty body.'
            exit 1
          }

      - name: Check apex redirect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          final_url="$(curl --silent --show-error --fail --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
            --retry 3 --retry-all-errors --max-time 30 \
            --output /dev/null --write-out '%{url_effective}' \
            https://santosdodia.com/)"

          case "$final_url" in
            https://www.santosdodia.com/*) ;;
            *) echo "Unexpected canonical URL: $final_url"; exit 1 ;;
          esac

      - name: Check system status API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept: application/json' \
            --header 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
            --retry 3 --retry-all-errors --max-time 30 \
            https://www.santosdodia.com/api/v1/system/status)"

          STATUS_RESPONSE="$response" node - <<'NODE'
          const body = JSON.parse(process.env.STATUS_RESPONSE ?? '{}');
          if (body.status !== 'ok') {
            console.error('Unexpected system status response:', body);
            process.exit(1);
          }
          NODE

      - name: Check OpenAPI contract endpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept: application/json' \
            --retry 3 --retry-all-errors --max-time 30 \
            https://www.santosdodia.com/openapi.json)"

          OPENAPI_RESPONSE="$response" node - <<'NODE'
          const body = JSON.parse(process.env.OPENAPI_RESPONSE ?? '{}');
          if (typeof body.openapi !== 'string' || !body.paths || typeof body.paths !== 'object') {
            console.error('Invalid OpenAPI response.');
            process.exit(1);
          }
          NODE

      - name: Check ICS feed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept: text/calendar,*/*;q=0.8' \
            --retry 3 --retry-all-errors --max-time 30 \
            https://www.santosdodia.com/api/ical/all)"

          printf '%s' "$response" | grep -q '^BEGIN:VCALENDAR' || {
            echo 'ICS response does not begin with BEGIN:VCALENDAR.'
            exit 1
          }
          printf '%s' "$response" | grep -q 'END:VCALENDAR' || {
            echo 'ICS response does not contain END:VCALENDAR.'
            exit 1
          }

      - name: Record probe summary
        if: always()
        run: |
          {
            echo '## SantosDia production health'
            echo '- All probes use a browser-like user agent and Portuguese language preference.'
            echo '- Every endpoint is checked even when an earlier probe fails.'
            echo '- Review the individual step result for homepage, redirect, status API, OpenAPI and ICS.'
          } >> "$GITHUB_STEP_SUMMARY"
