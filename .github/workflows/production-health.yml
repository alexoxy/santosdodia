name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-health.yml'

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTH_USER_AGENT: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36 SantosDiaHealth/1.0
    steps:
      - name: Probe homepage
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; body="$(mktemp)"
          status="$(curl --silent --show-error --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            --header 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
            --retry 2 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            https://www.santosdodia.com/)"
          if [ "$status" = 403 ] && grep -qi '^cf-ray:' "$headers"; then
            echo '::warning::Homepage probe was blocked by the Cloudflare WAF; DNS, TLS and Cloudflare edge were reachable.'
            exit 0
          fi
          [ "$status" = 200 ] || { echo "Homepage returned HTTP $status"; cat "$headers"; exit 1; }
          grep -qi '^cf-ray:' "$headers" || { echo 'Cloudflare cf-ray header missing.'; exit 1; }
          test -s "$body" || { echo 'Homepage returned an empty body.'; exit 1; }

      - name: Probe apex redirect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; body="$(mktemp)"
          result="$(curl --silent --show-error --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" \
            --header 'Accept-Language: pt-PT,pt;q=0.9,en;q=0.6' \
            --retry 2 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code} %{url_effective}' \
            https://santosdodia.com/)"
          status="${result%% *}"; final_url="${result#* }"
          if [ "$status" = 403 ] && grep -qi '^cf-ray:' "$headers"; then
            echo '::warning::Apex probe was blocked by the Cloudflare WAF after reaching the edge.'
            exit 0
          fi
          [ "$status" = 200 ] || { echo "Apex request returned HTTP $status"; exit 1; }
          case "$final_url" in https://www.santosdodia.com/*) ;; *) echo "Unexpected canonical URL: $final_url"; exit 1 ;; esac

      - name: Probe status API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; body="$(mktemp)"
          status="$(curl --silent --show-error --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" --header 'Accept: application/json' \
            --retry 2 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            https://www.santosdodia.com/api/v1/system/status)"
          if [ "$status" = 403 ] && grep -qi '^cf-ray:' "$headers"; then
            echo '::warning::Status API probe was blocked by the Cloudflare WAF; no application-health conclusion is possible from this runner.'
            exit 0
          fi
          [ "$status" = 200 ] || { echo "Status API returned HTTP $status"; exit 1; }
          STATUS_FILE="$body" node - <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync(process.env.STATUS_FILE,'utf8'));
          if(value.status!=='ok'){console.error(value);process.exit(1)}
          NODE

      - name: Probe OpenAPI
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; body="$(mktemp)"
          status="$(curl --silent --show-error --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" --header 'Accept: application/json' \
            --retry 2 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            https://www.santosdodia.com/openapi.json)"
          if [ "$status" = 403 ] && grep -qi '^cf-ray:' "$headers"; then
            echo '::warning::OpenAPI probe was blocked by the Cloudflare WAF.'
            exit 0
          fi
          [ "$status" = 200 ] || { echo "OpenAPI returned HTTP $status"; exit 1; }
          OPENAPI_FILE="$body" node - <<'NODE'
          const fs=require('node:fs');
          const value=JSON.parse(fs.readFileSync(process.env.OPENAPI_FILE,'utf8'));
          if(typeof value.openapi!=='string'||!value.paths||typeof value.paths!=='object')process.exit(1)
          NODE

      - name: Probe ICS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"; body="$(mktemp)"
          status="$(curl --silent --show-error --location --compressed --http1.1 \
            --user-agent "$HEALTH_USER_AGENT" --header 'Accept: text/calendar,*/*;q=0.8' \
            --retry 2 --retry-all-errors --max-time 30 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            https://www.santosdodia.com/api/ical/all)"
          if [ "$status" = 403 ] && grep -qi '^cf-ray:' "$headers"; then
            echo '::warning::ICS probe was blocked by the Cloudflare WAF.'
            exit 0
          fi
          [ "$status" = 200 ] || { echo "ICS endpoint returned HTTP $status"; exit 1; }
          grep -q '^BEGIN:VCALENDAR' "$body" || { echo 'ICS does not begin with BEGIN:VCALENDAR.'; exit 1; }
          grep -q 'END:VCALENDAR' "$body" || { echo 'ICS does not contain END:VCALENDAR.'; exit 1; }

      - name: Record probe summary
        if: always()
        run: |
          {
            echo '## SantosDia production health'
            echo '- Transport failures, TLS/DNS failures, unexpected HTTP codes and 5xx responses fail the workflow.'
            echo '- A Cloudflare 403 with cf-ray is recorded as a WAF warning, not as a false application outage.'
            echo '- Application-level validation runs whenever the WAF permits the GitHub runner request.'
          } >> "$GITHUB_STEP_SUMMARY"
