name: Ecclesiastical OSINT Monitor

on:
  schedule:
    - cron: '17 05 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osint-monitor.yml'
      - 'scripts/monitor-ecclesiastical-osint.mjs'

permissions:
  contents: read

concurrency:
  group: ecclesiastical-osint-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch official source changes
        run: npm run osint:monitor

      - name: Validate generated JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/generated/osint/holy-see-latest.json','utf8'))"

      - name: Upload candidate package for Dropbox staging
        uses: actions/upload-artifact@v4
        with:
          name: ecclesiastical-osint-candidates-${{ github.run_id }}
          path: data/generated/osint/
          if-no-files-found: error
          retention-days: 30

      - name: Record staging summary
        run: |
          {
            echo '## Ecclesiastical OSINT staging'
            echo '- Official-source candidate JSON: validated'
            echo '- GitHub publication or pull request: not attempted'
            echo '- Next gate: archive in Dropbox, normalize, review and approve before database promotion'
            echo "- Workflow run: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
