name: Validate Cloudflare portability

on:
  push:
    branches:
      - agent/cloudflare-portability
    paths:
      - package.json
      - wrangler.jsonc
      - open-next.config.ts
      - public/_headers
      - .github/workflows/cloudflare-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit installed runtime
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Build Cloudflare Worker
        run: npm run cloudflare:build

      - name: Verify OpenNext output
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          echo "Worker output: $(du -h .open-next/worker.js | cut -f1)"
          echo "Static assets: $(find .open-next/assets -type f | wc -l) files"

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(cloudflare): refresh dependency lock"
          git push
