name: D1 staging control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe staging operation
        required: true
        type: choice
        options:
          - provision
          - promote
      database_id:
        description: D1 staging UUID (required for promote)
        required: false
        type: string
      package_url:
        description: Single-use Dropbox URL for the immutable normalized package
        required: false
        type: string
      approval_url:
        description: Single-use Dropbox URL for the staging approval manifest
        required: false
        type: string
      approval_canonical_sha256:
        description: SHA-256 of compact canonical approval JSON
        required: false
        type: string
      confirmation:
        description: Exact operation confirmation phrase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: d1-staging-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: d1-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Guard Cloudflare Free daily remote-operation budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p reports
          node scripts/cloudflare-free-guardrails.mjs action-budget \
            --workflow d1-staging.yml \
            --repository "${{ github.repository }}" \
            --current-run-id "${{ github.run_id }}" \
            --token-env GITHUB_TOKEN \
            > reports/cloudflare-free-daily-budget.json
          cat reports/cloudflare-free-daily-budget.json

      - name: Require Cloudflare staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Guard provision request
        if: inputs.operation == 'provision'
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "PROVISION_SANTOSDIA_D1_STAGING" || {
            echo "Provision confirmation phrase is incorrect."
            exit 1
          }

      - name: Provision or reuse EU staging database
        if: inputs.operation == 'provision'
        run: node scripts/manage-d1-staging.mjs provision --output reports/d1-staging-provision.json

      - name: Publish provision receipt
        if: inputs.operation == 'provision'
        uses: actions/upload-artifact@v7
        with:
          name: d1-staging-provision-receipt
          path: |
            reports/d1-staging-provision.json
            reports/cloudflare-free-daily-budget.json
          if-no-files-found: error
          retention-days: 30

      - name: Guard promotion request
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          test "${{ inputs.confirmation }}" = "PROMOTE_WITHHELD_TO_D1_STAGING" || {
            echo "Promotion confirmation phrase is incorrect."
            exit 1
          }
          test -n "${{ inputs.database_id }}"
          test -n "${{ inputs.package_url }}"
          test -n "${{ inputs.approval_url }}"
          test -n "${{ inputs.approval_canonical_sha256 }}"

      - name: Validate Dropbox sources and approval hash
        if: inputs.operation == 'promote'
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
          APPROVAL_URL: ${{ inputs.approval_url }}
          APPROVAL_SHA256: ${{ inputs.approval_canonical_sha256 }}
        run: |
          node - <<'NODE'
          for (const [name, value] of [['PACKAGE_URL', process.env.PACKAGE_URL], ['APPROVAL_URL', process.env.APPROVAL_URL]]) {
            const url = new URL(value);
            if (!url.hostname.endsWith('.dropboxusercontent.com')) throw new Error(`${name} must be a direct Dropbox download URL.`);
          }
          if (!/^[a-f0-9]{64}$/.test(process.env.APPROVAL_SHA256 ?? '')) {
            throw new Error('APPROVAL_SHA256 must be a lowercase SHA-256.');
          }
          NODE

      - name: Download immutable package and approval
        if: inputs.operation == 'promote'
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
          APPROVAL_URL: ${{ inputs.approval_url }}
        shell: bash
        run: |
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output /tmp/calendar-normalized.json "$PACKAGE_URL"
          curl --fail-with-body --location --proto '=https' --tlsv1.2 \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output /tmp/calendar-approval.json "$APPROVAL_URL"

      - name: Verify approval identity and apply it in temporary storage
        if: inputs.operation == 'promote'
        id: approval
        env:
          EXPECTED_APPROVAL_SHA256: ${{ inputs.approval_canonical_sha256 }}
        shell: bash
        run: |
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const approval = JSON.parse(fs.readFileSync('/tmp/calendar-approval.json', 'utf8'));
          const actual = createHash('sha256').update(JSON.stringify(approval)).digest('hex');
          if (actual !== process.env.EXPECTED_APPROVAL_SHA256) throw new Error('Approval canonical SHA-256 mismatch.');
          NODE
          node scripts/apply-calendar-staging-approval.mjs \
            --package /tmp/calendar-normalized.json \
            --approval /tmp/calendar-approval.json \
            --output /tmp/calendar-approved.json \
            --metadata-output /tmp/calendar-approval-metadata.json
          node - <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('/tmp/calendar-approval-metadata.json', 'utf8'));
          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `run_id=${metadata.approvalId}\n`);
          fs.appendFileSync(output, `manifest_sha256=${metadata.manifestSha256}\n`);
          fs.appendFileSync(output, `validation_report_path=${metadata.validationReportPath}\n`);
          NODE

      - name: Guard approved package against Cloudflare Free limits
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          node scripts/cloudflare-free-guardrails.mjs calendar-package \
            --input /tmp/calendar-approved.json \
            > reports/cloudflare-free-package-estimate.json
          cat reports/cloudflare-free-package-estimate.json

      - name: Build canonical and atomic D1 packages
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          node scripts/normalize-calendar-staging-package.mjs \
            --input /tmp/calendar-approved.json \
            --output /tmp/calendar-canonical.json \
            --manifest-sha256 "${{ steps.approval.outputs.manifest_sha256 }}" \
            --validation-report-path "${{ steps.approval.outputs.validation_report_path }}"
          node scripts/build-calendar-staging-sql.mjs \
            --input /tmp/calendar-canonical.json \
            --output /tmp/calendar-staging.sql
          node scripts/prepare-d1-calendar-package.mjs \
            --input /tmp/calendar-staging.sql \
            --output /tmp/calendar-d1-batch.json

      - name: Guard atomic D1 batch against Cloudflare Free limits
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          node scripts/cloudflare-free-guardrails.mjs d1-batch \
            --input /tmp/calendar-d1-batch.json \
            > reports/cloudflare-free-d1-estimate.json
          cat reports/cloudflare-free-d1-estimate.json

      - name: Generate ephemeral staging binding
        if: inputs.operation == 'promote'
        run: |
          node scripts/write-d1-staging-config.mjs \
            --database-id "${{ inputs.database_id }}" \
            --output /tmp/wrangler.d1-staging.json

      - name: Verify target is the staging database
        if: inputs.operation == 'promote'
        shell: bash
        run: |
          npx wrangler d1 info CALENDAR_DB --config /tmp/wrangler.d1-staging.json --json > /tmp/d1-info.json
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('/tmp/d1-info.json', 'utf8'));
          const database = Array.isArray(value) ? value[0] : value;
          if (database?.name !== 'santosdodia-staging') throw new Error(`Refusing target database ${database?.name ?? 'unknown'}.`);
          if (database?.uuid !== process.env.EXPECTED_DATABASE_ID) throw new Error('D1 database UUID does not match the requested staging UUID.');
          NODE
        env:
          EXPECTED_DATABASE_ID: ${{ inputs.database_id }}

      - name: Apply D1 migrations with Cloudflare backup
        if: inputs.operation == 'promote'
        run: npx wrangler d1 migrations apply CALENDAR_DB --remote --config /tmp/wrangler.d1-staging.json

      - name: Apply atomic withheld package and prove idempotency
        if: inputs.operation == 'promote'
        run: |
          node scripts/manage-d1-staging.mjs apply \
            --database-id "${{ inputs.database_id }}" \
            --package /tmp/calendar-d1-batch.json \
            --run-id "${{ steps.approval.outputs.run_id }}" \
            --output reports/d1-staging-promotion.json

      - name: Publish promotion receipt
        if: inputs.operation == 'promote'
        uses: actions/upload-artifact@v7
        with:
          name: d1-staging-promotion-receipt
          path: |
            reports/d1-staging-promotion.json
            reports/cloudflare-free-daily-budget.json
            reports/cloudflare-free-package-estimate.json
            reports/cloudflare-free-d1-estimate.json
            /tmp/calendar-approval-metadata.json
          if-no-files-found: error
          retention-days: 30
