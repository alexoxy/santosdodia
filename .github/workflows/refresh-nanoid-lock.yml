name: One-shot nanoid lock refresh

on:
  push:
    branches:
      - agent/autonomous-data-plane-shadow
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: one-shot-nanoid-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/autonomous-data-plane-shadow

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched nanoid resolution
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/nanoid']?.version;
          if (version !== '3.3.17') throw new Error(`Expected nanoid 3.3.17, got ${version ?? 'missing'}`);
          console.log(`nanoid ${version} locked.`);
          NODE
          npm audit --audit-level=high --package-lock-only

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Fix nanoid security advisory in lockfile'
          git push origin HEAD:agent/autonomous-data-plane-shadow
