name: One-shot localized CSS cleanup

on:
  push:
    branches:
      - agent/autonomous-data-plane-shadow
    paths:
      - scripts/maintenance/remove-css-capitalize.flag

permissions:
  contents: write

concurrency:
  group: one-shot-localized-css-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/autonomous-data-plane-shadow

      - name: Remove automatic capitalization from CSS
        shell: bash
        run: |
          set -euo pipefail
          before="$(grep -R -o 'text-transform:capitalize' app --include='*.css' | wc -l)"
          echo "Found ${before} automatic capitalization declaration(s)."
          if [ "$before" -lt 1 ]; then
            echo 'Nothing to change.'
            exit 0
          fi
          find app -type f -name '*.css' -print0 | xargs -0 sed -i 's/text-transform:capitalize/text-transform:none/g'
          if grep -R -n 'text-transform:capitalize' app --include='*.css'; then
            echo 'Automatic capitalization remains after cleanup.' >&2
            exit 1
          fi

      - name: Commit CSS cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app; then
            echo 'No CSS changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/*.css
          git commit -m 'Remove locale-unsafe CSS capitalization'
          git push origin HEAD:agent/autonomous-data-plane-shadow
