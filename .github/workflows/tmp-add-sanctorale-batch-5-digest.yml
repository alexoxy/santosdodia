name: Temporary add Sanctorale batch 5 digest

on:
  push:
    branches:
      - migration/sanctorale-doctors-review-5-20260831
    paths:
      - '.github/workflows/tmp-add-sanctorale-batch-5-digest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-doctors-review-5-20260831

      - name: Add immutable batch 5 digest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs';
          const text = fs.readFileSync(path, 'utf8');
          const from = "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-4.json', 'cccb4c22979975a05fad2457f0d16ed82ef77765e6bdb92bcfc8c80b488817b9']\n]);";
          const to = "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-4.json', 'cccb4c22979975a05fad2457f0d16ed82ef77765e6bdb92bcfc8c80b488817b9'],\n  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-5.json', '34a036067ec2311ea1a2aa842f65da557ab0d8fb9d5ce71e0cbc15c733177a26']\n]);";
          if ((text.split(from).length - 1) !== 1) throw new Error('Digest allowlist anchor changed unexpectedly.');
          fs.writeFileSync(path, text.replace(from, to), 'utf8');
          NODE

      - name: Validate reviewed packs
        run: node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-add-sanctorale-batch-5-digest.yml

      - name: Commit reviewed gate update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs .github/workflows/tmp-add-sanctorale-batch-5-digest.yml
          git commit -m 'Allowlist reviewed Sanctorale batch 5 digest'
          git push origin HEAD:migration/sanctorale-doctors-review-5-20260831
