name: Public locale readiness

on:
  schedule:
    - cron: '52 9 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-locale-readiness.yml'
      - 'scripts/check-public-locale-readiness.mjs'
      - 'lib/i18n.ts'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Measure live calendar coverage for every supported locale
        run: node scripts/check-public-locale-readiness.mjs | tee public-locale-readiness.json
      - name: Archive readiness evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-locale-readiness-${{ github.run_id }}
          path: public-locale-readiness.json
          if-no-files-found: error
          retention-days: 30
