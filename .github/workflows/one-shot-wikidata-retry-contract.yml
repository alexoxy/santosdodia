name: One-shot Wikidata retry contract

on:
  push:
    branches:
      - agent/wikidata-retry
    paths:
      - scripts/maintenance/wikidata-retry-contract.flag

permissions:
  contents: write

concurrency:
  group: one-shot-wikidata-retry-contract
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/wikidata-retry

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Apply contract patch
        run: node scripts/maintenance/patch-wikidata-retry-contract.mjs

      - name: Test retry and baseline contract
        run: |
          node scripts/osint/test-wikidata-adapter-retry.mjs
          npm run saints:baseline-test
          npm run saints:baseline-audit
          npm run automation:audit

      - name: Commit durable changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-saints-baseline-wikidata.yml scripts/baseline/audit-saints-baseline-plan.mjs scripts/baseline/test-saints-baseline-tools.mjs
          if git diff --cached --quiet; then
            echo 'No contract changes generated.'
            exit 1
          fi
          git commit -m 'Gate transient Wikidata retries in baseline CI'
          git push origin HEAD:agent/wikidata-retry
