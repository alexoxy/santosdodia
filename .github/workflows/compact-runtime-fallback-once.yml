name: One-time runtime fallback compaction

on:
  push:
    branches: [agent/architecture-stabilization]
    paths:
      - '.github/workflows/compact-runtime-fallback-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-runtime-fallback-compaction
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/architecture-stabilization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Build compact fallback and update runtime import
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-runtime-fallback.mjs \
            data/generated/source-snapshot.json \
            data/generated/runtime-fallback.json

          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/live-sources.ts';
          const before = fs.readFileSync(path, 'utf8');
          const oldFunction = `function snapshotItems(year: number): Observance[] {
            const items = SNAPSHOT.years?.[String(year)]?.observations;
            return Array.isArray(items) ? items : [];
          }`;
          const newFunction = `function snapshotItems(year: number, locale: Locale): Observance[] {
            const items = SNAPSHOT.years?.[String(year)]?.observations;
            if (!Array.isArray(items)) return [];
            return items.flatMap(raw => {
              const item = raw as Partial<Observance>;
              const names = item.names;
              const name = names
                ? names[locale] ?? names.en ?? Object.values(names).find(value => typeof value === 'string' && value.trim())
                : undefined;
              if (!item.id || !item.dateISO || !name || !item.traditions || !item.category || !item.calendarSystem) return [];
              const [, month, day] = item.dateISO.split('-').map(Number);
              return [{ ...item, month, day, name } as Observance];
            });
          }`;

          let after = before.replace(
            "import snapshot from '../data/generated/source-snapshot.json';",
            "import snapshot from '../data/generated/runtime-fallback.json';"
          );
          after = after.replace(oldFunction, newFunction);
          after = after.replace(
            'const fallback = live.length ? [] : snapshotItems(year);',
            'const fallback = live.length ? [] : snapshotItems(year, locale);'
          );

          if (after === before || after.includes("source-snapshot.json") || after.includes('snapshotItems(year);')) {
            throw new Error('Runtime fallback migration did not update all expected code paths.');
          }
          fs.writeFileSync(path, after);
          NODE

          git config user.name 'santosdodia-hygiene-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/generated/runtime-fallback.json lib/live-sources.ts
          git rm data/generated/source-snapshot.json
          git rm .github/workflows/compact-runtime-fallback-once.yml
          git commit -m 'refactor(data): replace monolithic source snapshot with compact runtime fallback'
          git push origin HEAD:agent/architecture-stabilization
