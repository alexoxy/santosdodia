name: Wikidata retry quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - scripts/osint/adapters/wikidata-saints.mjs
      - scripts/osint/test-wikidata-adapter-retry.mjs
      - scripts/osint/audit-wikidata-retry-contract.mjs
      - config/saints-baseline-wikidata.json
      - .github/workflows/wikidata-retry-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: Test bounded transient retry behavior
        run: node scripts/osint/test-wikidata-adapter-retry.mjs
      - name: Audit retry and cursor contract
        run: node scripts/osint/audit-wikidata-retry-contract.mjs
      - name: Revalidate Saints Baseline epoch invariants
        run: npm run saints:baseline-audit
