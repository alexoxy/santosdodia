name: Temporary add Sanctorale batch 6 digest

on:
  push:
    branches:
      - migration/sanctorale-pastors-virgins-review-6-20260831
    paths:
      - '.github/workflows/tmp-add-sanctorale-batch-6-digest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-pastors-virgins-review-6-20260831
      - name: Add immutable batch 6 digest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs';
          const text=fs.readFileSync(path,'utf8');
          const from="  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-5.json', '34a036067ec2311ea1a2aa842f65da557ab0d8fb9d5ce71e0cbc15c733177a26']\n]);";
          const to="  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-5.json', '34a036067ec2311ea1a2aa842f65da557ab0d8fb9d5ce71e0cbc15c733177a26'],\n  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-6.json', 'd3063d35657bcaf57a8575d67b406466f6c207105e2cd9346af020e5c25320c8']\n]);";
          if ((text.split(from).length-1)!==1) throw new Error('Digest allowlist anchor changed unexpectedly.');
          fs.writeFileSync(path,text.replace(from,to),'utf8');
          NODE
          node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-add-sanctorale-batch-6-digest.yml
      - name: Commit gate update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs .github/workflows/tmp-add-sanctorale-batch-6-digest.yml
          git commit -m 'Allowlist reviewed Sanctorale batch 6 digest'
          git push origin HEAD:migration/sanctorale-pastors-virgins-review-6-20260831
