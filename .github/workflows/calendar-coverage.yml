name: Calendar coverage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calendar-coverage.yml'
      - 'scripts/check-production-calendar-coverage.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-coverage.yml'
      - 'scripts/check-production-calendar-coverage.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/check-production-calendar-coverage.mjs
