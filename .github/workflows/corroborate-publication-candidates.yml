name: Corroborate publication candidates

on:
  workflow_run:
    workflows: ['Classify publication candidates']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corroborate-publication-candidates-saints-wikidata
  cancel-in-progress: false

jobs:
  corroborate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate corroboration boundary
        run: |
          npm run autonomy:test
          npm run autonomy:corroboration-test
          npm run automation:audit
          node -e "const p=require('./config/corroboration-policy.json'); if(p.productionWriteAllowed!==false||p.mode!=='shadow-corroboration') process.exit(1)"

      - name: Pull latest verified publication decisions from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: npm run dropbox:pull-stream -- --stream publication-decisions/saints/wikidata --destination staging/dropbox-intake/publication-decisions/saints/wikidata

      - name: Validate and extract publication decision package
        shell: bash
        run: |
          set -euo pipefail
          archive='staging/dropbox-intake/publication-decisions/saints/wikidata/package.tar.gz'
          destination='staging/dropbox-intake/publication-decisions/saints/wikidata/extracted'
          mkdir -p "$destination"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const archive = 'staging/dropbox-intake/publication-decisions/saints/wikidata/package.tar.gz';
          const listing = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' });
          for (const entry of listing.split(/\r?\n/).filter(Boolean)) {
            if (entry.startsWith('/') || entry.split('/').includes('..')) throw new Error(`Unsafe archive entry: ${entry}`);
          }
          NODE
          tar -xzf "$archive" -C "$destination" --no-same-owner --no-same-permissions

      - name: Pull latest Vatican first-party corroboration evidence
        id: vatican_evidence
        continue-on-error: true
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: npm run dropbox:pull-stream -- --stream corroboration-evidence/vatican-news/pt --destination staging/dropbox-intake/corroboration-evidence/vatican-news/pt

      - name: Extract optional first-party evidence
        if: ${{ steps.vatican_evidence.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          archive='staging/dropbox-intake/corroboration-evidence/vatican-news/pt/package.tar.gz'
          destination='staging/dropbox-intake/corroboration-evidence/vatican-news/pt/extracted'
          mkdir -p "$destination" staging/corroboration-evidence-external
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const archive = 'staging/dropbox-intake/corroboration-evidence/vatican-news/pt/package.tar.gz';
          const listing = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' });
          for (const entry of listing.split(/\r?\n/).filter(Boolean)) {
            if (entry.startsWith('/') || entry.split('/').includes('..')) throw new Error(`Unsafe archive entry: ${entry}`);
          }
          NODE
          tar -xzf "$archive" -C "$destination" --no-same-owner --no-same-permissions
          evidence="$(find "$destination" -type f -name evidence.json | head -n 1)"
          test -n "$evidence"
          cp "$evidence" staging/corroboration-evidence-external/vatican-news-pt.json

      - name: Corroborate cross-check queue
        shell: bash
        run: |
          set -euo pipefail
          input="$(find staging/dropbox-intake/publication-decisions/saints/wikidata/extracted -type f -name cross-check-queue.json -printf '%h\n' | head -n 1)"
          test -n "$input"
          mkdir -p staging/corroboration-evidence-external
          node scripts/autonomy/corroborate-publication-candidates.mjs \
            --input "$input" \
            --evidence-dir staging/corroboration-evidence-external \
            --output staging/corroboration/saints/wikidata
          cp staging/dropbox-intake/publication-decisions/saints/wikidata/consumer-receipt.json \
            staging/corroboration/saints/wikidata/upstream-decisions-receipt.json

      - name: Verify shadow output and conflict escalation
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base='staging/corroboration/saints/wikidata';
          const report=JSON.parse(fs.readFileSync(`${base}/corroboration-report.json`,'utf8'));
          const auto=JSON.parse(fs.readFileSync(`${base}/corroborated-shadow.json`,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(`${base}/upstream-decisions-receipt.json`,'utf8'));
          if(report.mode!=='shadow-corroboration'||report.productionWriteAllowed!==false) throw new Error('Corroborator escaped shadow mode.');
          if(auto.productionWriteAllowed!==false) throw new Error('Corroborated shadow queue authorized production writes.');
          if(receipt.verified!==true) throw new Error('Corroborator did not consume a verified Dropbox package.');
          if(report.summary.inputClaims!==report.summary.corroborated+report.summary.pending+report.summary.conflicts) throw new Error('Corroboration queues do not partition the input claims.');
          NODE

      - name: Upload corroboration evidence
        uses: actions/upload-artifact@v7
        with:
          name: corroboration-saints-wikidata-${{ github.run_id }}
          path: staging/corroboration/saints/wikidata/
          if-no-files-found: error
          retention-days: 30

      - name: Archive corroboration queues in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/archive-to-dropbox.mjs --stream corroboration/saints/wikidata --source staging/corroboration/saints/wikidata
