name: Validate approved leader seed generator

on:
  push:
    branches:
      - agent/d1-portugal-promotion
    paths:
      - 'scripts/build-portugal-leaders-seed.mjs'
      - 'package.json'
      - '.github/workflows/validate-approved-seed-generator.yml'
      - 'db/migrations/0001_ecclesiastical_directory.sql'

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-approved-leader-seed
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Create synthetic approved CSV
        shell: bash
        run: |
          cat > /tmp/approved.csv <<'CSV'
          person_id,name,jurisdiction_id,jurisdiction,office_title,country,reference_source_url,official_source_url,verification_status,effective_date,notes
          CSV
          jurisdictions=(dlisb dangr dfunc dgrdp dleir dpacb dsntp dsetu dbrgp davei dbrmi dcoim dlame dprtp dvdcp dvlrp dvise devor dbeja dfaro dmlpt dxxpt)
          for index in $(seq 1 29); do
            jurisdiction="${jurisdictions[$(( (index - 1) % ${#jurisdictions[@]} ))]}"
            printf 'person:catholic-hierarchy:btest%s,Test Person %s,%s,Test, Bispo de Teste,PT,https://www.catholic-hierarchy.org/bishop/btest%s.html,https://www.conferenciaepiscopal.pt/v1/dioceses/,officially-corroborated,,Synthetic validation row\n' "$index" "$index" "$jurisdiction" "$index" >> /tmp/approved.csv
          done

      - name: Generate approved seed
        run: npm run leaders:approved-sql -- --input=/tmp/approved.csv --output=/tmp/approved.sql --expected=29 --verified-at=2026-08-03

      - name: Apply migration and seed twice
        shell: bash
        run: |
          sqlite3 /tmp/approved.db < db/migrations/0001_ecclesiastical_directory.sql
          sqlite3 /tmp/approved.db < /tmp/approved.sql
          sqlite3 /tmp/approved.db < /tmp/approved.sql
          test "$(sqlite3 /tmp/approved.db 'SELECT COUNT(*) FROM people;')" = '29'
          test "$(sqlite3 /tmp/approved.db 'SELECT COUNT(*) FROM ecclesiastical_offices;')" = '29'
          test "$(sqlite3 /tmp/approved.db 'SELECT COUNT(*) FROM source_assertions;')" = '29'
          test -z "$(sqlite3 /tmp/approved.db 'PRAGMA foreign_key_check;')"

      - name: Run repository quality gate
        run: npm run check

      - name: Build Cloudflare worker
        run: npm run cloudflare:build

      - name: Record validation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `✅ Approved Dropbox CSV → D1 seed generator validated on commit \`${context.sha}\`. A synthetic 29-record approved file generated an idempotent seed; migration plus two seed executions produced 29 people, 29 offices, 29 authoritative assertions and zero foreign-key violations. The repository quality gate and Cloudflare build also passed. Run: ${context.runId}.`
            });
