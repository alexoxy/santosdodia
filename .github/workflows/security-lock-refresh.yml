name: Security lock refresh

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-lock-refresh-main
  cancel-in-progress: true

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exactly from refreshed lockfile
        run: npm ci --include=optional

      - name: Audit all installed dependencies
        run: npm audit --audit-level=high

      - name: Run repository quality gate
        run: npm run check

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi

          git config user.name 'santosdodia-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): refresh lockfile for patched dependencies'

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Lockfile conflicts with newer main changes; refusing automatic resolution.'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo 'Unable to publish the refreshed lockfile after three attempts.'
          exit 1
