name: Calendar and discovery data quality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/calendar/**'
      - 'scripts/enrichment/**'
      - 'scripts/discovery/**'
      - 'scripts/dropbox/list-archive-chunks.mjs'
      - 'scripts/dropbox/pull-stream-set.mjs'
      - 'scripts/dropbox/pull-latest-stream.mjs'
      - 'scripts/sync-litcal-mirror.mjs'
      - 'data/releases/roman-catholic-pt-2026.overlay-review.json'
      - 'data/observance-editorial.ts'
      - 'lib/observance-editorial.ts'
      - 'lib/public-observances.ts'
      - 'lib/calendar-public-adapter.ts'
      - 'app/components/DayView.tsx'
      - 'config/saints-profile-enrichment-v1.json'
      - 'config/saints-label-enrichment-v2.json'
      - '.github/workflows/harvest-vatican-saints.yml'
      - '.github/workflows/portugal-snl-calendar.yml'
      - '.github/workflows/enrich-saints-profile-wikidata.yml'
      - '.github/workflows/enrich-saints-label-wikidata.yml'
      - '.github/workflows/enrich-saints-labels-wikidata.yml'
      - '.github/workflows/build-saints-navigation-exports.yml'
      - '.github/workflows/update-litcal-mirror.yml'
      - '.github/workflows/calendar-data-quality.yml'
      - 'config/automation-registry.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-data-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Audit repository and automation registry
        run: |
          npm run repo:audit
          npm run automation:audit
          npm run automation:test

      - name: Test complete daily calendar invariants
        run: |
          node scripts/calendar/test-litcal-daily-coverage.mjs
          node scripts/calendar/test-harvest-vatican-saints.mjs
          node scripts/calendar/test-normalize-vatican-saints.mjs
          node scripts/calendar/test-vatican-reference-policy.mjs
          node scripts/calendar/test-portugal-snl-agenda.mjs
          node scripts/calendar/test-portugal-snl-reconciliation.mjs
          node scripts/calendar/test-portugal-snl-precedence-transfers.mjs
          node scripts/calendar/test-portugal-snl-shared-structure.mjs
          node scripts/calendar/test-portugal-snl-review-bundle.mjs
          node scripts/calendar/test-portugal-jurisdiction-overlay-plan.mjs
          node scripts/calendar/test-portugal-overlay-review-plan.mjs
          node scripts/calendar/test-portugal-effective-calendar-preview.mjs
          node scripts/calendar/test-observance-editorial.mjs

      - name: Test profile and multilingual enrichment safeguards
        run: |
          node scripts/enrichment/test-wikidata-profile-core.mjs
          node scripts/enrichment/test-wikidata-profile-pipeline.mjs
          node scripts/enrichment/test-wikidata-label-pipeline.mjs

      - name: Test navigation assembly and export gates
        run: |
          node scripts/discovery/test-enrichment-chunk-set.mjs
          node scripts/discovery/test-assemble-navigation-source.mjs
          node scripts/discovery/test-navigation-readiness.mjs
          node scripts/discovery/test-navigation-exports.mjs

      - name: Typecheck and lint application
        run: |
          npm run typecheck
          npm run lint
