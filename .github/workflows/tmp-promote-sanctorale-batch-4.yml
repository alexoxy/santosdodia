name: Temporary Sanctorale batch 4 promotion

on:
  push:
    branches:
      - migration/sanctorale-doctors-promote-4-20260831
    paths:
      - '.github/workflows/tmp-promote-sanctorale-batch-4.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-doctors-promote-4-20260831

      - name: Apply reviewed batch 4 promotion deterministically
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const read = (p) => fs.readFileSync(p, 'utf8');
          const write = (p, s) => fs.writeFileSync(p, s, 'utf8');
          const json = (p) => JSON.parse(read(p));
          const assert = (c, m) => { if (!c) throw new Error(m); };
          const replaceExact = (p, from, to) => {
            const text = read(p);
            const count = text.split(from).length - 1;
            assert(count === 1, `${p}: expected exactly one replacement, found ${count}: ${from}`);
            write(p, text.replace(from, to));
          };
          const insertBefore = (p, marker, block, uniqueNeedle) => {
            const text = read(p);
            assert(!text.includes(uniqueNeedle), `${p}: candidate appears already present: ${uniqueNeedle}`);
            const idx = text.lastIndexOf(marker);
            assert(idx >= 0, `${p}: insertion marker not found`);
            write(p, `${text.slice(0, idx)},\n${block}${text.slice(idx)}`);
          };
          const fmt = (value, indent = 4) => JSON.stringify(value, null, 2).split('\n').map((line) => ' '.repeat(indent) + line).join('\n');
          const appendArrayRecordsAtEnd = (p, records, uniqueNeedle) => {
            const block = records.map((r) => fmt(r, 4)).join(',\n');
            insertBefore(p, '\n  ]\n}', block, uniqueNeedle);
          };

          const packPath = 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-review-batch-4.json';
          const pack = json(packPath);
          const expectedReviewDigest = 'cccb4c22979975a05fad2457f0d16ed82ef77765e6bdb92bcfc8c80b488817b9';
          assert(pack.reviewDigestSha256 === expectedReviewDigest, 'Unexpected review pack digest.');
          assert(crypto.createHash('sha256').update(JSON.stringify(pack.candidates)).digest('hex') === expectedReviewDigest, 'Review pack payload digest mismatch.');
          assert(pack.candidates.length === 5 && pack.mutationAllowed === false && pack.promotionAllowed === false, 'Review pack is not the approved bounded non-mutating batch.');

          const coveragePath = 'data/migrations/roman-catholic-pt-2026-v2.canonical-coverage.json';
          const fixedPath = 'data/migrations/roman-catholic-pt-2026-v2.fixed-sanctorale-shadow.json';
          const currentCoverage = json(coveragePath);
          const currentFixed = json(fixedPath);
          assert(currentCoverage.coverage.explicitOccurrenceAnchors === 33 && currentCoverage.coverage.mappedOccurrenceAnchors === 96 && currentCoverage.coverage.remainingLegacyOccurrences === 293 && currentCoverage.coverage.promotionAllowed === false, 'Canonical coverage baseline drifted before batch 4 promotion.');
          assert(currentFixed.mappings.length === 33 && currentFixed.mutationAllowed === false, 'Fixed Sanctorale baseline drifted before batch 4 promotion.');
          assert(crypto.createHash('sha256').update(JSON.stringify(currentFixed.mappings)).digest('hex') === '707290628d022ef2d98d32c55946be0f9fc376ca1cce1ce8039f49577941b660', 'Fixed Sanctorale baseline digest drifted before batch 4 promotion.');

          const personRecords = [];
          const recognitionRecords = [];
          const observanceRecords = [];
          const ruleRecords = [];
          const occurrenceRecords = [];
          const bridgeRecords = [];
          const fixedMappings = [];

          for (const c of pack.candidates) {
            const s = c.source;
            personRecords.push(c.person);
            recognitionRecords.push({
              id: c.recognition.id,
              personId: c.person.id,
              churchId: 'church:roman-catholic',
              jurisdictionId: 'global',
              recognizedAs: 'saint',
              recognitionBasis: 'official-church-attestation',
              ecclesialTitles: c.recognition.ecclesialTitles,
              scope: 'church-wide',
              calendarMembershipImplied: false,
              observanceDateImplied: false,
              evidence: [{
                publisher: 'Vatican News',
                url: c.recognition.evidenceUrl,
                claimTypes: ['saint-designation', 'identity', ...c.recognition.ecclesialTitles]
              }],
              verifiedAt: pack.verifiedAt
            });
            observanceRecords.push({
              id: c.observanceId,
              churchId: 'church:roman-catholic',
              observanceKey: 'principal-commemoration',
              observanceType: 'person-commemoration',
              subjects: [{ kind: 'person', personId: c.person.id, recognitionId: c.recognition.id }],
              scope: 'church-attested',
              occurrenceDateImplied: false,
              calendarSystemImplied: false,
              jurisdictionImplied: false,
              rankImplied: false,
              precedenceImplied: false,
              evidence: [{ publisher: 'Vatican News', url: c.recognition.evidenceUrl, claimTypes: ['observance-attestation', 'liturgical-designation'] }],
              verifiedAt: pack.verifiedAt
            });
            const [, month, day] = s.dateISO.split('-').map(Number);
            ruleRecords.push({
              id: c.sanctoraleRuleId,
              observanceId: c.observanceId,
              scopeKey: 'general-roman',
              dateRule: { type: 'fixed', month, day },
              liturgicalRank: 'obligatory-memorial',
              precedenceClass: 'general-obligatory-memorial',
              isSolemnity: false,
              evidence: [{ publisher: 'Secretariado Nacional de Liturgia', url: s.snlUrl, claimTypes: ['fixed-date', 'obligatory-memorial', 'general-calendar', 'portugal-materialization'] }],
              verifiedAt: pack.verifiedAt
            });
            const occurrenceId = `occurrence:${s.dateISO}:${c.person.id}:roman-catholic:pt`;
            occurrenceRecords.push({
              id: occurrenceId,
              observanceId: c.observanceId,
              churchId: 'church:roman-catholic',
              jurisdictionId: 'jurisdiction:roman-catholic:pt',
              calendarSystem: 'gregorian',
              year: 2026,
              dateISO: s.dateISO,
              rank: 'obligatory-memorial',
              sourceRankCode: 'MO',
              evidence: [{ publisher: 'Secretariado Nacional de Liturgia', url: s.snlUrl, claimTypes: ['annual-date', 'jurisdictional-observance', 'liturgical-rank'], observedDesignation: s.observedDesignation }],
              verifiedAt: pack.verifiedAt
            });
            bridgeRecords.push({ occurrenceId, legacyObservanceId: s.canonicalEventId, dateISO: s.dateISO });
            fixedMappings.push({
              occurrenceId,
              observanceId: c.observanceId,
              sanctoraleRuleId: c.sanctoraleRuleId,
              legacyObservanceId: s.canonicalEventId,
              expectedDateISO: s.dateISO,
              sourceOccurrenceId: s.sourceOccurrenceId,
              sourceRecordHash: s.sourceRecordHash,
              legacyRank: s.legacyRank,
              canonicalRank: s.canonicalRank,
              sourceRankCode: s.sourceRankCode,
              reviewStatus: 'source-bound-exact',
              resolution: 'exact-fixed-date-binding'
            });
          }

          appendArrayRecordsAtEnd('data/canonical-person-anchors.json', personRecords, '"id": "john-cross"');
          appendArrayRecordsAtEnd('data/canonical-recognition-anchors.json', recognitionRecords, '"id": "recognition:john-cross:roman-catholic"');
          appendArrayRecordsAtEnd('data/canonical-observance-anchors.json', observanceRecords, '"id": "observance:john-cross:roman-catholic"');
          appendArrayRecordsAtEnd('data/canonical-roman-sanctorale-rule-anchors.json', ruleRecords, '"id": "sanctorale-rule:john-cross:general-roman"');
          appendArrayRecordsAtEnd('data/canonical-occurrence-anchors.json', occurrenceRecords, '"id": "occurrence:2026-12-14:john-cross:roman-catholic:pt"');
          appendArrayRecordsAtEnd('data/canonical-occurrence-legacy-bridges.json', bridgeRecords, '"legacyObservanceId": "rc:StJohnCross"');

          {
            const block = fixedMappings.map((r) => '    ' + JSON.stringify(r)).join(',\n');
            insertBefore(fixedPath, '\n  ],\n  "mutationAllowed": false', block, '"legacyObservanceId":"rc:StJohnCross"');
          }

          const updatedFixed = json(fixedPath);
          assert(updatedFixed.mappings.length === 38, `Expected 38 fixed mappings, got ${updatedFixed.mappings.length}`);
          const fixedDigest = crypto.createHash('sha256').update(JSON.stringify(updatedFixed.mappings)).digest('hex');

          replaceExact(coveragePath, '"explicitOccurrenceAnchors": 33', '"explicitOccurrenceAnchors": 38');
          replaceExact(coveragePath, '"mappedOccurrenceAnchors": 96', '"mappedOccurrenceAnchors": 101');
          replaceExact(coveragePath, '"remainingLegacyOccurrences": 293', '"remainingLegacyOccurrences": 288');

          const sanctoraleTest = 'scripts/test-roman-sanctorale.mjs';
          replaceExact(sanctoraleTest,
            "assert(pt2026.publicationAllowed === false && pt2026.candidates.length === 33, 'Portugal Sanctorale materialization must remain shadow-only with thirty-three reviewed rules.');",
            "assert(pt2026.publicationAllowed === false && pt2026.candidates.length === 38, 'Portugal Sanctorale materialization must remain shadow-only with thirty-eight reviewed rules.');"
          );
          replaceExact(sanctoraleTest,
            "    ['observance:francis-xavier:roman-catholic', ['2026-12-03', 'obligatory-memorial', 10, 'general-roman']]\n  ]);",
            "    ['observance:francis-xavier:roman-catholic', ['2026-12-03', 'obligatory-memorial', 10, 'general-roman']],\n    ['observance:john-cross:roman-catholic', ['2026-12-14', 'obligatory-memorial', 10, 'general-roman']],\n    ['observance:ambrose-milan:roman-catholic', ['2026-12-07', 'obligatory-memorial', 10, 'general-roman']],\n    ['observance:gregory-great:roman-catholic', ['2026-09-03', 'obligatory-memorial', 10, 'general-roman']],\n    ['observance:francis-de-sales:roman-catholic', ['2026-01-24', 'obligatory-memorial', 10, 'general-roman']],\n    ['observance:alphonsus-liguori:roman-catholic', ['2026-08-01', 'obligatory-memorial', 10, 'general-roman']]\n  ]);"
          );
          replaceExact(sanctoraleTest,
            "assert(occurrences.occurrences.length === 33, 'Occurrence anchor count changed; update the Sanctorale equivalence vector intentionally.');",
            "assert(occurrences.occurrences.length === 38, 'Occurrence anchor count changed; update the Sanctorale equivalence vector intentionally.');"
          );
          replaceExact(sanctoraleTest,
            "assert(annual2026.status === 'resolved' && annual2026.finalCalendar, 'The thirty-three reviewed 2026 Sanctorale rules must resolve through the full annual engine.');",
            "assert(annual2026.status === 'resolved' && annual2026.finalCalendar, 'The thirty-eight reviewed 2026 Sanctorale rules must resolve through the full annual engine.');"
          );
          replaceExact(sanctoraleTest,
            "assert(annual2026.appliedTransfers.length === 0, 'The thirty-three reviewed 2026 Sanctorale vectors must not require a transfer.');",
            "assert(annual2026.appliedTransfers.length === 0, 'The thirty-eight reviewed 2026 Sanctorale vectors must not require a transfer.');"
          );

          const personTest = 'scripts/vault/test-canonical-person-manifest.mjs';
          replaceExact(personTest,
            "assert(first.manifest.peopleCount === 39, 'The current reviewed canonical Person anchor baseline unexpectedly changed; review the migration explicitly.');",
            "assert(first.manifest.peopleCount === 44, 'The current reviewed canonical Person anchor baseline unexpectedly changed; review the migration explicitly.');"
          );

          const recognitionTest = 'scripts/vault/test-canonical-recognition-manifest.mjs';
          replaceExact(recognitionTest,
            "assert(first.manifest.recognitionCount === 37, 'Reviewed Recognition count changed and requires explicit review.');",
            "assert(first.manifest.recognitionCount === 42, 'Reviewed Recognition count changed and requires explicit review.');"
          );
          replaceExact(recognitionTest,
            "assert(first.manifest.personCoverageCount === 36, 'Reviewed Recognition Person coverage changed unexpectedly.');",
            "assert(first.manifest.personCoverageCount === 41, 'Reviewed Recognition Person coverage changed unexpectedly.');"
          );

          const observanceTest = 'scripts/vault/test-canonical-observance-manifest.mjs';
          replaceExact(observanceTest,
            "assert(first.manifest.observanceCount === 35, 'Reviewed Observance count changed and requires explicit review.');",
            "assert(first.manifest.observanceCount === 40, 'Reviewed Observance count changed and requires explicit review.');"
          );
          replaceExact(observanceTest,
            "assert(first.manifest.personCoverageCount === 36, 'Reviewed Observance Person coverage changed unexpectedly.');",
            "assert(first.manifest.personCoverageCount === 41, 'Reviewed Observance Person coverage changed unexpectedly.');"
          );

          const occurrenceTest = 'scripts/vault/test-canonical-occurrence-manifest.mjs';
          replaceExact(occurrenceTest,
            "assert(first.manifest.occurrenceCount === 33, 'Reviewed Occurrence count changed and requires explicit review.');",
            "assert(first.manifest.occurrenceCount === 38, 'Reviewed Occurrence count changed and requires explicit review.');"
          );
          replaceExact(occurrenceTest,
            "assert(first.manifest.legacyBridgeCount === 33, 'Reviewed legacy bridge count changed and requires explicit review.');",
            "assert(first.manifest.legacyBridgeCount === 38, 'Reviewed legacy bridge count changed and requires explicit review.');"
          );
          replaceExact(occurrenceTest,
            "  ['observance:francis-xavier:roman-catholic', ['2026-12-03', 'obligatory-memorial', 'MO', 'rc:StFrancisXavier']]\n]);",
            "  ['observance:francis-xavier:roman-catholic', ['2026-12-03', 'obligatory-memorial', 'MO', 'rc:StFrancisXavier']],\n  ['observance:john-cross:roman-catholic', ['2026-12-14', 'obligatory-memorial', 'MO', 'rc:StJohnCross']],\n  ['observance:ambrose-milan:roman-catholic', ['2026-12-07', 'obligatory-memorial', 'MO', 'rc:StAmbrose']],\n  ['observance:gregory-great:roman-catholic', ['2026-09-03', 'obligatory-memorial', 'MO', 'rc:StGregoryGreat']],\n  ['observance:francis-de-sales:roman-catholic', ['2026-01-24', 'obligatory-memorial', 'MO', 'rc:StFrancisDeSales']],\n  ['observance:alphonsus-liguori:roman-catholic', ['2026-08-01', 'obligatory-memorial', 'MO', 'rc:StAlphonsusMariaDeLiguori']]\n]);"
          );

          const uploaderTest = 'scripts/vault/test-dropbox-canonical-recognition-uploader.mjs';
          replaceExact(uploaderTest, '  assert.equal(firstPointer.recognitionCount, 37);', '  assert.equal(firstPointer.recognitionCount, 42);');
          replaceExact(uploaderTest, '  assert.equal(firstPointer.personCoverageCount, 36);', '  assert.equal(firstPointer.personCoverageCount, 41);');

          const coverageTest = 'scripts/vault/test-portugal-v2-canonical-coverage.mjs';
          replaceExact(coverageTest,
            "assert(explicitOccurrences.length === 33 && explicitOccurrences.length === coverage.coverage.explicitOccurrenceAnchors, 'Explicit canonical Occurrence count must remain exactly thirty-three.');",
            "assert(explicitOccurrences.length === 38 && explicitOccurrences.length === coverage.coverage.explicitOccurrenceAnchors, 'Explicit canonical Occurrence count must remain exactly thirty-eight.');"
          );
          replaceExact(coverageTest,
            "assert(explicitBridges.length === 33 && explicitBridges.length === coverage.coverage.explicitOccurrenceAnchors, 'Explicit legacy bridge count must equal the thirty-three canonical Occurrences.');",
            "assert(explicitBridges.length === 38 && explicitBridges.length === coverage.coverage.explicitOccurrenceAnchors, 'Explicit legacy bridge count must equal the thirty-eight canonical Occurrences.');"
          );
          replaceExact(coverageTest,
            "assert(Array.isArray(fixedSanctoraleShadow.mappings) && fixedSanctoraleShadow.mappings.length === 33, 'Fixed Sanctorale shadow must contain exactly thirty-three exact source bindings.');",
            "assert(Array.isArray(fixedSanctoraleShadow.mappings) && fixedSanctoraleShadow.mappings.length === 38, 'Fixed Sanctorale shadow must contain exactly thirty-eight exact source bindings.');"
          );
          replaceExact(coverageTest,
            "assert(fixedSanctoraleMappingDigest === '707290628d022ef2d98d32c55946be0f9fc376ca1cce1ce8039f49577941b660', `Fixed Sanctorale mapping set differs from the explicitly reviewed approved-artifact rows: ${fixedSanctoraleMappingDigest}.`);",
            `assert(fixedSanctoraleMappingDigest === '${fixedDigest}', \`Fixed Sanctorale mapping set differs from the explicitly reviewed approved-artifact rows: \${fixedSanctoraleMappingDigest}.\`);`
          );
          replaceExact(coverageTest,
            "assert(explicitOccurrenceById.size === 33 && explicitBridgeByOccurrence.size === 33 && fixedMappingByOccurrence.size === 33, 'Fixed Sanctorale canonical/source identities must be unique.');",
            "assert(explicitOccurrenceById.size === 38 && explicitBridgeByOccurrence.size === 38 && fixedMappingByOccurrence.size === 38, 'Fixed Sanctorale canonical/source identities must be unique.');"
          );
          replaceExact(coverageTest,
            "assert(coveredSourceIds.size === 85 && coveredSourceHashes.size === 85 && coveredOccurrenceIds.size === 85, 'Fixed, TemporalRule and TemporalRuleFamily source/canonical identities must not overlap.');",
            "assert(coveredSourceIds.size === 90 && coveredSourceHashes.size === 90 && coveredOccurrenceIds.size === 90, 'Fixed, TemporalRule and TemporalRuleFamily source/canonical identities must not overlap.');"
          );
          replaceExact(coverageTest,
            "assert(totalMapped === 96 && totalMapped === coverage.coverage.mappedOccurrenceAnchors, 'Combined canonical shadow coverage must be exactly 96/389.');",
            "assert(totalMapped === 101 && totalMapped === coverage.coverage.mappedOccurrenceAnchors, 'Combined canonical shadow coverage must be exactly 101/389.');"
          );
          replaceExact(coverageTest,
            "assert(coverage.coverage.remainingLegacyOccurrences === 293 && coverage.coverage.remainingLegacyOccurrences === 389 - totalMapped, 'Remaining legacy count must be exactly 293.');",
            "assert(coverage.coverage.remainingLegacyOccurrences === 288 && coverage.coverage.remainingLegacyOccurrences === 389 - totalMapped, 'Remaining legacy count must be exactly 288.');"
          );
          replaceExact(coverageTest,
            "assert(coveragePercent === 24.679, `Unexpected canonical coverage percentage ${coveragePercent}.`);",
            "assert(coveragePercent === 25.964, `Unexpected canonical coverage percentage ${coveragePercent}.`);"
          );
          replaceExact(coverageTest,
            "console.log(`Portugal v2 canonical migration gate passed: ${totalMapped}/389 (${coveragePercent}%) = 33 exact fixed Sanctorale + 5 TemporalRule + 47 precedence-surviving family rows + 11 movable/transfer rows; 293 remaining, promotion blocked.`);",
            "console.log(`Portugal v2 canonical migration gate passed: ${totalMapped}/389 (${coveragePercent}%) = 38 exact fixed Sanctorale + 5 TemporalRule + 47 precedence-surviving family rows + 11 movable/transfer rows; 288 remaining, promotion blocked.`);"
          );

          const receipt = {
            schemaVersion: 1,
            status: 'canonical-sanctorale-promotion-completed',
            reviewPack: 'roman-catholic-pt-2026-v2.sanctorale-review-batch-4.json',
            reviewDigestSha256: expectedReviewDigest,
            sourceReleaseId: pack.sourceReleaseId,
            promotedPersonIds: pack.candidates.map((c) => c.person.id),
            canonicalCoverageAfterPromotion: { mappedOccurrenceAnchors: 101, requiredForPromotion: 389, remainingLegacyOccurrences: 288 },
            fixedSanctoraleMappingDigestSha256: fixedDigest,
            runtimePublicationAllowed: false,
            productionWriteAllowed: false,
            promotionAllowed: false,
            verifiedAt: '2026-08-31'
          };
          write('data/migrations/roman-catholic-pt-2026-v2.sanctorale-promotion-batch-4.json', JSON.stringify(receipt, null, 2) + '\n');

          for (const p of [
            'data/canonical-person-anchors.json',
            'data/canonical-recognition-anchors.json',
            'data/canonical-observance-anchors.json',
            'data/canonical-roman-sanctorale-rule-anchors.json',
            'data/canonical-occurrence-anchors.json',
            'data/canonical-occurrence-legacy-bridges.json',
            fixedPath,
            coveragePath,
            'data/migrations/roman-catholic-pt-2026-v2.sanctorale-promotion-batch-4.json'
          ]) JSON.parse(read(p));

          const finalCoverage = json(coveragePath);
          assert(finalCoverage.coverage.explicitOccurrenceAnchors === 38 && finalCoverage.coverage.mappedOccurrenceAnchors === 101 && finalCoverage.coverage.remainingLegacyOccurrences === 288 && finalCoverage.coverage.promotionAllowed === false, 'Final canonical coverage invariants failed.');
          console.log(JSON.stringify({ promoted: receipt.promotedPersonIds, fixedDigest, coverage: '101/389', coveragePercent: 25.964, remaining: 288 }, null, 2));
          NODE

      - name: Validate promotion receipt and review bindings
        run: |
          node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs
          git diff --check

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-promote-sanctorale-batch-4.yml

      - name: Commit deterministic promotion
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data scripts .github/workflows/tmp-promote-sanctorale-batch-4.yml
          git commit -m 'Promote reviewed Sanctorale batch 4 canonically'
          git push origin HEAD:migration/sanctorale-doctors-promote-4-20260831
