name: Product release production

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/releases/roman-catholic-pt-2026.production.json'
      - '.github/workflows/product-release-production.yml'
  push:
    branches:
      - main
    paths:
      - 'data/releases/roman-catholic-pt-2026.production.json'
      - '.github/workflows/product-release-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-release-production-roman-catholic-pt-2026
  cancel-in-progress: false

env:
  APPROVAL_FILE: data/releases/roman-catholic-pt-2026.production.json
  PRODUCTION_DATABASE_ID: e1ad3640-b334-49d1-a6fc-a73f54924803
  STAGING_RUN_ID: '31545979632'
  SOURCE_MAIN_COMMIT: 6d9fb34bc3f4a85e1c2a4d9f8ec8b7591a2c58c3
  RELEASE_ARTIFACT: roman-catholic-product-release-6d9fb34bc3f4a85e1c2a4d9f8ec8b7591a2c58c3

jobs:
  validate-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate exact production approval
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const approval = JSON.parse(fs.readFileSync(process.env.APPROVAL_FILE, 'utf8'));
          const expected = {
            releaseId: 'roman-catholic-pt-2026-v1',
            sourceMainCommit: process.env.SOURCE_MAIN_COMMIT,
            stagingWorkflowRunId: Number(process.env.STAGING_RUN_ID),
            releaseArtifactName: process.env.RELEASE_ARTIFACT,
          };
          if (approval.approved !== true || approval.approvalMode !== 'explicit-one-shot-product-release') throw new Error('Release is not explicitly approved.');
          for (const [key, value] of Object.entries(expected)) {
            if (approval[key] !== value) throw new Error(`${key} mismatch.`);
          }
          if (approval.productionDatabase?.name !== 'santosdodia-production' || approval.productionDatabase?.uuid !== process.env.PRODUCTION_DATABASE_ID) throw new Error('Production D1 target mismatch.');
          if (approval.stagingDatabase?.name !== 'santosdodia-staging' || approval.stagingDatabase?.uuid !== 'e212681b-a958-4554-9d44-d48cf85f2978') throw new Error('Staging evidence target mismatch.');
          if (approval.expected?.occurrences !== 365 || approval.expected?.days !== 365 || approval.expected?.labels !== 1825 || approval.expected?.calendarAssertions !== 730) throw new Error('Expected product counts changed.');
          if (JSON.stringify(approval.scope?.publicLocales) !== JSON.stringify(['en','pt','es','fr','it'])) throw new Error('Public locale scope changed.');
          if (approval.safety?.automaticFutureProductionWrites !== false || approval.safety?.importInitiallyInvisible !== true || approval.safety?.publishOnlyAfterRemoteVerification !== true || approval.safety?.requiresPreReleaseTimeTravelBookmark !== true) throw new Error('Release safety contract changed.');
          console.log('Exact one-shot production approval is valid.');
          NODE

  release-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-approval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Cloudflare credentials are currently held in this protected environment.
    # The target is nevertheless hard-checked below as santosdodia-production.
    environment: d1-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Download the exact staging-validated release
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: reports/product-release
          github-token: ${{ github.token }}
          repository: alexoxy/santosdodia
          run-id: ${{ env.STAGING_RUN_ID }}

      - name: Verify downloaded release identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const approval = JSON.parse(fs.readFileSync(process.env.APPROVAL_FILE,'utf8'));
          const validation = JSON.parse(fs.readFileSync('reports/product-release/validation.json','utf8'));
          const release = JSON.parse(fs.readFileSync('reports/product-release/release.json','utf8'));
          if (validation.sourceSha !== process.env.SOURCE_MAIN_COMMIT) throw new Error(`Artifact source SHA mismatch: ${validation.sourceSha}`);
          if (validation.status !== 'validated-for-staging' || validation.productionApproved !== false) throw new Error('Unexpected staging validation receipt state.');
          if (release.release !== 'roman-catholic-pt-2026' || release.publicationStatus !== 'publishable') throw new Error('Unexpected release artifact state.');
          if (release.expectedOccurrences !== approval.expected.occurrences || release.expectedLabels !== approval.expected.labels || release.expectedCalendarAssertions !== approval.expected.calendarAssertions) throw new Error('Release artifact counts differ from approval.');
          if (release.safety?.automaticFutureProductionWrites !== false || release.safety?.generatedFromLaunchReadyBuildOnly !== true) throw new Error('Release artifact safety contract mismatch.');
          console.log('Downloaded artifact is the exact staging-validated release.');
          NODE

      - name: Verify production target and capture pre-release Time Travel bookmark
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 info CALENDAR_DB --config wrangler.jsonc --json > reports/product-release/production-info-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('reports/product-release/production-info-before.json','utf8'));
          const db = Array.isArray(value) ? value[0] : value;
          if (db?.name !== 'santosdodia-production') throw new Error(`Refusing D1 target ${db?.name ?? 'unknown'}.`);
          if (db?.uuid !== process.env.PRODUCTION_DATABASE_ID) throw new Error(`Production UUID mismatch: ${db?.uuid ?? 'unknown'}.`);
          NODE
          npx wrangler d1 time-travel info CALENDAR_DB --config wrangler.jsonc --json > reports/product-release/bookmark-before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('reports/product-release/bookmark-before.json','utf8'));
          const bookmark = value?.bookmark ?? value?.result?.bookmark ?? (Array.isArray(value) ? value[0]?.bookmark : null);
          if (!bookmark) throw new Error('Could not capture pre-release D1 Time Travel bookmark.');
          console.log(`Pre-release bookmark captured: ${bookmark}`);
          NODE

      - name: Apply schema and exact release invisibly
        run: |
          npx wrangler d1 migrations apply CALENDAR_DB --remote --config wrangler.jsonc
          npx wrangler d1 execute CALENDAR_DB --remote --config wrangler.jsonc --file reports/product-release/release.sql

      - name: Verify invisible production import
        run: |
          npx wrangler d1 execute CALENDAR_DB --remote --config wrangler.jsonc --json --command "SELECT (SELECT COUNT(*) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31') AS occurrences, (SELECT COUNT(DISTINCT date_iso) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31') AS days, (SELECT COUNT(*) FROM calendar_occurrence_labels l JOIN calendar_occurrences o ON o.id=l.occurrence_id WHERE o.church_id='roman-catholic' AND o.jurisdiction_id='pt' AND o.date_iso BETWEEN '2026-01-01' AND '2026-12-31') AS labels, (SELECT COUNT(*) FROM calendar_occurrence_assertions a JOIN calendar_occurrences o ON o.id=a.occurrence_id WHERE o.church_id='roman-catholic' AND o.jurisdiction_id='pt' AND o.date_iso BETWEEN '2026-01-01' AND '2026-12-31') AS calendar_assertions, (SELECT COUNT(*) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND publication_status='publishable') AS publishable, (SELECT COUNT(*) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND publication_status='published') AS published;" > reports/product-release/production-counts-before-publish.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const approval = JSON.parse(fs.readFileSync(process.env.APPROVAL_FILE,'utf8'));
          const payload = JSON.parse(fs.readFileSync('reports/product-release/production-counts-before-publish.json','utf8'));
          const row = payload?.[0]?.results?.[0] ?? payload?.[0]?.result?.[0] ?? payload?.results?.[0] ?? payload?.result?.[0];
          if (!row) throw new Error('Could not parse production count query.');
          for (const [field,key] of [['occurrences','occurrences'],['days','days'],['labels','labels'],['calendar_assertions','calendarAssertions']]) {
            if (Number(row[field]) !== Number(approval.expected[key])) throw new Error(`${field}: expected ${approval.expected[key]}, got ${row[field]}`);
          }
          if (Number(row.publishable) !== 365 || Number(row.published) !== 0) throw new Error(`Release is not safely invisible: ${JSON.stringify(row)}`);
          console.log(`Invisible production import verified: ${row.occurrences} occurrences, ${row.labels} labels.`);
          NODE

      - name: Verify production semantic samples before visibility
        run: |
          npx wrangler d1 execute CALENDAR_DB --remote --config wrangler.jsonc --json --command "SELECT o.date_iso,l.locale,l.name FROM calendar_occurrences o JOIN calendar_occurrence_labels l ON l.occurrence_id=o.id WHERE o.church_id='roman-catholic' AND o.jurisdiction_id='pt' AND o.date_iso IN ('2026-01-01','2026-08-11') AND l.locale IN ('en','pt','es','fr','it') ORDER BY o.date_iso,l.locale;" > reports/product-release/production-samples.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('reports/product-release/production-samples.json','utf8'));
          const rows = payload?.[0]?.results ?? payload?.[0]?.result ?? payload?.results ?? payload?.result ?? [];
          if (rows.length !== 10) throw new Error(`Expected 10 semantic sample labels, got ${rows.length}.`);
          const map = new Map(rows.map(r => [`${r.date_iso}|${r.locale}`, String(r.name)]));
          const checks = [
            ['2026-08-11','en',/clare/i],['2026-08-11','pt',/clara/i],['2026-08-11','es',/clara/i],['2026-08-11','fr',/claire/i],['2026-08-11','it',/chiara/i],
            ['2026-01-01','en',/(mary|mother of god)/i],['2026-01-01','pt',/(maria|mãe de deus)/i],['2026-01-01','es',/(maría|madre de dios)/i],['2026-01-01','fr',/(marie|mère de dieu)/i],['2026-01-01','it',/(maria|madre di dio)/i],
          ];
          for (const [date,locale,pattern] of checks) {
            const value = map.get(`${date}|${locale}`) ?? '';
            if (!pattern.test(value)) throw new Error(`${date} ${locale} semantic sample failed: ${value}`);
          }
          console.log('Production semantic samples passed while release is still invisible.');
          NODE

      - name: Publish exactly the approved 365-day release
        run: |
          npx wrangler d1 execute CALENDAR_DB --remote --config wrangler.jsonc --command "UPDATE calendar_occurrences SET publication_status='published', updated_at=CURRENT_TIMESTAMP WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND publication_status='publishable';"

      - name: Verify published production read model
        run: |
          npx wrangler d1 execute CALENDAR_DB --remote --config wrangler.jsonc --json --command "SELECT (SELECT COUNT(*) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND publication_status='published' AND validation_status='cross-checked') AS published, (SELECT COUNT(DISTINCT date_iso) FROM calendar_occurrences WHERE church_id='roman-catholic' AND jurisdiction_id='pt' AND date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND publication_status='published') AS days, (SELECT COUNT(*) FROM calendar_occurrence_labels l JOIN calendar_occurrences o ON o.id=l.occurrence_id WHERE o.church_id='roman-catholic' AND o.jurisdiction_id='pt' AND o.date_iso BETWEEN '2026-01-01' AND '2026-12-31' AND o.publication_status='published') AS labels;" > reports/product-release/production-counts-published.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('reports/product-release/production-counts-published.json','utf8'));
          const row = payload?.[0]?.results?.[0] ?? payload?.[0]?.result?.[0] ?? payload?.results?.[0] ?? payload?.result?.[0];
          if (Number(row?.published) !== 365 || Number(row?.days) !== 365 || Number(row?.labels) !== 1825) throw new Error(`Published read-model verification failed: ${JSON.stringify(row)}`);
          console.log(`Production published: ${row.published} occurrences, ${row.days} days, ${row.labels} labels.`);
          NODE
          npx wrangler d1 time-travel info CALENDAR_DB --config wrangler.jsonc --json > reports/product-release/bookmark-after.json

      - name: Write production release receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const approval = JSON.parse(fs.readFileSync(process.env.APPROVAL_FILE,'utf8'));
          const before = JSON.parse(fs.readFileSync('reports/product-release/bookmark-before.json','utf8'));
          const after = JSON.parse(fs.readFileSync('reports/product-release/bookmark-after.json','utf8'));
          const extract = value => value?.bookmark ?? value?.result?.bookmark ?? (Array.isArray(value) ? value[0]?.bookmark : null);
          const receipt = {
            schemaVersion: 1,
            releaseId: approval.releaseId,
            releasedAt: new Date().toISOString(),
            releaseCommit: process.env.GITHUB_SHA,
            sourceMainCommit: approval.sourceMainCommit,
            stagingWorkflowRunId: approval.stagingWorkflowRunId,
            productionDatabase: approval.productionDatabase,
            preReleaseBookmark: extract(before),
            postReleaseBookmark: extract(after),
            publishedOccurrences: 365,
            publishedDays: 365,
            publishedLabels: 1825,
            semanticSamples: 'passed',
            rollbackCommand: `npx wrangler d1 time-travel restore CALENDAR_DB --config wrangler.jsonc --bookmark=${extract(before)}`,
            automaticFutureProductionWrites: false,
          };
          if (!receipt.preReleaseBookmark || !receipt.postReleaseBookmark) throw new Error('Production receipt is missing Time Travel bookmarks.');
          fs.writeFileSync('reports/product-release/production-receipt.json', JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Upload production verification receipt
        uses: actions/upload-artifact@v7
        with:
          name: roman-catholic-production-release-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            reports/product-release/production-info-before.json
            reports/product-release/bookmark-before.json
            reports/product-release/production-counts-before-publish.json
            reports/product-release/production-samples.json
            reports/product-release/production-counts-published.json
            reports/product-release/bookmark-after.json
            reports/product-release/production-receipt.json

  archive-production-receipt:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: dropbox-archive
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Download production receipt
        uses: actions/download-artifact@v8
        with:
          name: roman-catholic-production-release-${{ github.sha }}
          path: reports/product-release

      - name: Archive production receipt in canonical Dropbox release folder
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          TARGET: /Santos do Dia/02_Dados_Eclesiasticos/06_Publicacao/roman-catholic/2026/production/${{ github.sha }}/production-receipt.json
        run: node scripts/dropbox/upload-exact-file.mjs --source reports/product-release/production-receipt.json --path "$TARGET"
