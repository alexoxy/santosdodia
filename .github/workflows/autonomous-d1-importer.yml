name: Autonomous D1 importer

on:
  workflow_run:
    workflows: ['Autonomous linguistic review']
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: autonomous-importer-saints-wikidata
  cancel-in-progress: false

jobs:
  prepare-import:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Validate autonomous import topology
        run: |
          npm run autonomy:test
          npm run autonomy:lanes-audit
          npm run linguistic:audit
          npm run temporal:test

      - name: Pull latest verified reviewed partition from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: npm run dropbox:pull-stream -- --stream osint-reviewed/saints/wikidata --destination staging/dropbox-intake/osint-reviewed/saints/wikidata

      - name: Validate and extract reviewed package
        shell: bash
        run: |
          set -euo pipefail
          archive='staging/dropbox-intake/osint-reviewed/saints/wikidata/package.tar.gz'
          destination='staging/dropbox-intake/osint-reviewed/saints/wikidata/extracted'
          mkdir -p "$destination"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const archive = 'staging/dropbox-intake/osint-reviewed/saints/wikidata/package.tar.gz';
          const listing = execFileSync('tar', ['-tzf', archive], { encoding: 'utf8' });
          for (const entry of listing.split(/\r?\n/).filter(Boolean)) {
            if (entry.startsWith('/') || entry.split('/').includes('..')) throw new Error(`Unsafe archive entry: ${entry}`);
          }
          NODE
          tar -xzf "$archive" -C "$destination" --no-same-owner --no-same-permissions

      - name: Enforce reviewed-package handoff contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = 'staging/dropbox-intake/osint-reviewed/saints/wikidata/extracted/staging/osint-reviewed/saints/wikidata';
          const manifest = JSON.parse(fs.readFileSync(`${base}/staging-manifest.json`, 'utf8'));
          const review = JSON.parse(fs.readFileSync(`${base}/linguistic-review.json`, 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('staging/dropbox-intake/osint-reviewed/saints/wikidata/consumer-receipt.json', 'utf8'));
          if (receipt.verified !== true) throw new Error('Importer did not receive a verified Dropbox package.');
          if (manifest.stage !== 'linguistically-reviewed' || manifest.publish !== false) throw new Error('Importer input is not a reviewed staging package.');
          if (review.criticalCount !== 0) throw new Error('Importer refuses unresolved critical linguistic issues.');
          NODE

      - name: Build idempotent atomic knowledge batch
        run: |
          npm run db:knowledge-batch -- \
            --input staging/dropbox-intake/osint-reviewed/saints/wikidata/extracted/staging/osint-reviewed/saints/wikidata \
            --output staging/d1-import/saints-wikidata.json

      - name: Guard batch against Cloudflare Free limits
        run: node scripts/cloudflare-free-guardrails.mjs d1-batch --input staging/d1-import/saints-wikidata.json > staging/d1-import/cloudflare-estimate.json

      - name: Upload immutable importer input
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-d1-input-saints-wikidata-${{ github.run_id }}
          path: staging/d1-import/
          if-no-files-found: error
          retention-days: 7

  import-staging:
    needs: prepare-import
    environment: d1-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Download immutable importer input
        uses: actions/download-artifact@v8
        with:
          name: autonomous-d1-input-saints-wikidata-${{ github.run_id }}
          path: staging/d1-import

      - name: Guard shared daily remote-operation budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          node scripts/autonomy/check-d1-daily-budget.mjs \
            --workflows autonomous-d1-importer.yml,import-saints-baseline-d1.yml \
            --repository "${{ github.repository }}" \
            --current-run-id "${{ github.run_id }}" \
            --token-env GITHUB_TOKEN \
            > reports/cloudflare-free-daily-budget.json

      - name: Provision or reuse EU D1 staging
        id: staging
        run: |
          node scripts/manage-d1-staging.mjs provision --output reports/d1-staging-provision.json
          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('reports/d1-staging-provision.json','utf8'));
          if (!value.database?.uuid) throw new Error('D1 staging UUID is missing.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `database_id=${value.database.uuid}\n`);
          NODE

      - name: Generate ephemeral staging binding
        run: node scripts/write-d1-staging-config.mjs --database-id "${{ steps.staging.outputs.database_id }}" --output /tmp/wrangler.d1-staging.json

      - name: Verify target database
        env:
          EXPECTED_DATABASE_ID: ${{ steps.staging.outputs.database_id }}
        run: |
          npx wrangler d1 info CALENDAR_DB --config /tmp/wrangler.d1-staging.json --json > /tmp/d1-info.json
          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync('/tmp/d1-info.json','utf8'));
          const database = Array.isArray(value) ? value[0] : value;
          if (database?.name !== 'santosdodia-staging') throw new Error(`Refusing D1 target ${database?.name ?? 'unknown'}.`);
          if (database?.uuid !== process.env.EXPECTED_DATABASE_ID) throw new Error('D1 UUID mismatch.');
          NODE

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply CALENDAR_DB --remote --config /tmp/wrangler.d1-staging.json

      - name: Import knowledge package with idempotency and rollback verification
        run: |
          npm run db:knowledge-import -- \
            --database-id "${{ steps.staging.outputs.database_id }}" \
            --package staging/d1-import/saints-wikidata.json \
            --output reports/d1-knowledge-import.json

      - name: Upload import receipt
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-d1-receipt-saints-wikidata-${{ github.run_id }}
          path: |
            reports/d1-knowledge-import.json
            reports/d1-staging-provision.json
            reports/cloudflare-free-daily-budget.json
            staging/d1-import/cloudflare-estimate.json
          if-no-files-found: error
          retention-days: 30

  archive-receipt:
    needs: import-staging
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified import receipt
        uses: actions/download-artifact@v8
        with:
          name: autonomous-d1-receipt-saints-wikidata-${{ github.run_id }}
          path: staging/import-receipt

      - name: Archive importer receipt in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: node scripts/archive-to-dropbox.mjs --stream import-receipts/saints/wikidata --source staging/import-receipt
