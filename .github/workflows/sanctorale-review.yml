name: Sanctorale review quality

on:
  push:
    branches:
      - main
    paths:
      - 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-review-batch-*.json'
      - 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-promotion-batch-*.json'
      - 'scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs'
      - '.github/workflows/sanctorale-review.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-review-batch-*.json'
      - 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-promotion-batch-*.json'
      - 'scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs'
      - '.github/workflows/sanctorale-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanctorale-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate reviewed Sanctorale packs
        run: node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs
