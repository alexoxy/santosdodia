name: Temporary add Sanctorale batch 7 digest

on:
  push:
    branches:
      - migration/sanctorale-martyrs-pastors-review-7-20260831
    paths:
      - '.github/workflows/tmp-add-sanctorale-batch-7-digest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-martyrs-pastors-review-7-20260831

      - name: Allowlist exact immutable batch 7 digest and validate
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const packPath = 'data/migrations/roman-catholic-pt-2026-v2.sanctorale-review-batch-7.json';
          const testPath = 'scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs';
          const pack = JSON.parse(fs.readFileSync(packPath, 'utf8'));
          const expected = 'd202a84a23baaaf98f81a4e600cbb7880d146b26dc7a234886543115cb33d2fa';
          const actual = crypto.createHash('sha256').update(JSON.stringify(pack.candidates)).digest('hex');
          if (actual !== expected || pack.reviewDigestSha256 !== expected) throw new Error(`Batch 7 digest mismatch: ${actual}`);
          let text = fs.readFileSync(testPath, 'utf8');
          const marker = "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-6.json', 'f3f89c6a5f9f70ec97b7613f5874bb3703b53ae7ae77017f49f7e287fd001699']\n]);";
          if (!text.includes(marker)) throw new Error('Batch 6 allowlist marker not found exactly once.');
          text = text.replace(marker, "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-6.json', 'f3f89c6a5f9f70ec97b7613f5874bb3703b53ae7ae77017f49f7e287fd001699'],\n  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-7.json', 'd202a84a23baaaf98f81a4e600cbb7880d146b26dc7a234886543115cb33d2fa']\n]);");
          fs.writeFileSync(testPath, text, 'utf8');
          NODE
          node scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs

      - name: Remove temporary workflow and commit review gate
        shell: bash
        run: |
          rm .github/workflows/tmp-add-sanctorale-batch-7-digest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bind reviewed Sanctorale batch 7 digest'
          git push origin HEAD:migration/sanctorale-martyrs-pastors-review-7-20260831
