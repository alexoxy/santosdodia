name: Build Saints navigation exports

on:
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/discovery/**'
      - 'scripts/product/**'
      - 'scripts/dropbox/list-archive-chunks.mjs'
      - 'scripts/dropbox/pull-stream-set.mjs'
      - 'scripts/dropbox/pull-latest-stream.mjs'
      - 'scripts/dropbox/publish-current-json.mjs'
      - 'data/liturgical-person-links.reviewed.json'
      - 'data/saint-navigation-publication.reviewed.json'
      - 'data/releases/roman-catholic-pt-2026-v2.production-request.json'
      - '.github/workflows/build-saints-navigation-exports.yml'
      - 'config/automation-registry.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: saints-navigation-exports-v1
  cancel-in-progress: false

jobs:
  assemble-and-export:
    environment: dropbox-archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Audit export contracts
        run: |
          npm run repo:audit
          npm run automation:audit
          node scripts/check-adsense-readiness.mjs
          node scripts/product/test-portugal-saint-publication-queue.mjs
          node scripts/discovery/test-enrichment-chunk-set.mjs
          node scripts/discovery/test-assemble-navigation-source.mjs
          node scripts/discovery/test-navigation-readiness.mjs
          node scripts/discovery/test-navigation-exports.mjs
          node scripts/discovery/test-reviewed-navigation-promotion.mjs

      - name: Pull current identity root
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/pull-latest-stream.mjs
          --stream baseline/saints/v1/identity/wikidata/recognition-v1
          --destination staging/navigation/identity

      - name: Pull enrichment watermarks and Vatican calendar if present
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: bash
        run: |
          node scripts/dropbox/pull-latest-stream.mjs --stream enrichment-progress/saints/v1/wikidata/profile-v1 --destination staging/navigation/profile-progress --allow-missing
          node scripts/dropbox/pull-latest-stream.mjs --stream enrichment-progress/saints/v1/wikidata/labels-v2 --destination staging/navigation/label-progress --allow-missing
          node scripts/dropbox/pull-latest-stream.mjs --stream calendar/vatican-saints/v1/pt --destination staging/navigation/vatican --allow-missing

      - name: Extract verified root and optional inputs
        shell: bash
        run: |
          node scripts/archive/extract-safe-tar.mjs --archive staging/navigation/identity/package.tar.gz --destination staging/navigation/identity/extracted
          for lane in profile-progress label-progress vatican; do
            if [ -f "staging/navigation/$lane/package.tar.gz" ]; then
              node scripts/archive/extract-safe-tar.mjs --archive "staging/navigation/$lane/package.tar.gz" --destination "staging/navigation/$lane/extracted"
            fi
          done
          mkdir -p staging/navigation/profile-chunks staging/navigation/label-chunks

      - name: Resolve input paths
        id: inputs
        shell: bash
        run: |
          manifest="$(find staging/navigation/identity/extracted -type f -name identity-manifest.json | sort | tail -n 1)"
          report="$(find staging/navigation/identity/extracted -type f -name identity-report.json | sort | tail -n 1)"
          ledger="$(find staging/navigation/identity/extracted -type f -name identity-ledger.jsonl | sort | tail -n 1)"
          profile_progress="$(find staging/navigation/profile-progress/extracted -type f -name profile-progress.json 2>/dev/null | sort | tail -n 1 || true)"
          label_progress="$(find staging/navigation/label-progress/extracted -type f -name label-progress.json 2>/dev/null | sort | tail -n 1 || true)"
          vatican="$(find staging/navigation/vatican/extracted -type f -name normalized.json 2>/dev/null | sort | tail -n 1 || true)"
          test -n "$manifest" && test -n "$report" && test -n "$ledger"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          echo "profile_progress=$profile_progress" >> "$GITHUB_OUTPUT"
          echo "label_progress=$label_progress" >> "$GITHUB_OUTPUT"
          echo "vatican=$vatican" >> "$GITHUB_OUTPUT"

      - name: Discover and validate profile chunks
        if: steps.inputs.outputs.profile_progress != ''
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          PROGRESS: ${{ steps.inputs.outputs.profile_progress }}
        shell: bash
        run: |
          node scripts/dropbox/list-archive-chunks.mjs --stream-prefix enrichment/saints/v1/normalized/wikidata/profile-v1 --output staging/navigation/profile-listing.json
          node scripts/discovery/audit-enrichment-chunk-set.mjs --listing staging/navigation/profile-listing.json --progress "$PROGRESS" --chunk-size 40 --output staging/navigation/profile-chunk-audit.json
          node scripts/dropbox/pull-stream-set.mjs --listing staging/navigation/profile-chunk-audit.json --destination staging/navigation/profile-chunks

      - name: Discover and validate multilingual label chunks
        if: steps.inputs.outputs.label_progress != ''
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          PROGRESS: ${{ steps.inputs.outputs.label_progress }}
        shell: bash
        run: |
          node scripts/dropbox/list-archive-chunks.mjs --stream-prefix enrichment/saints/v1/normalized/wikidata/labels-v2 --output staging/navigation/label-listing.json
          node scripts/discovery/audit-enrichment-chunk-set.mjs --listing staging/navigation/label-listing.json --progress "$PROGRESS" --chunk-size 200 --output staging/navigation/label-chunk-audit.json
          node scripts/dropbox/pull-stream-set.mjs --listing staging/navigation/label-chunk-audit.json --destination staging/navigation/label-chunks

      - name: Extract all verified enrichment chunks
        shell: bash
        run: |
          for root in staging/navigation/profile-chunks staging/navigation/label-chunks; do
            while IFS= read -r archive; do
              destination="${archive%/package.tar.gz}/extracted"
              node scripts/archive/extract-safe-tar.mjs --archive "$archive" --destination "$destination"
            done < <(find "$root" -type f -name package.tar.gz | sort)
          done

      - name: Assemble canonical navigation source
        env:
          IDENTITY_MANIFEST: ${{ steps.inputs.outputs.manifest }}
          IDENTITY_REPORT: ${{ steps.inputs.outputs.report }}
          IDENTITY_LEDGER: ${{ steps.inputs.outputs.ledger }}
          VATICAN: ${{ steps.inputs.outputs.vatican }}
        shell: bash
        run: |
          args=(
            --identity-manifest "$IDENTITY_MANIFEST"
            --identity-report "$IDENTITY_REPORT"
            --identity-ledger "$IDENTITY_LEDGER"
            --profiles-dir staging/navigation/profile-chunks
            --labels-dir staging/navigation/label-chunks
            --output staging/navigation/output/navigation-source.json
          )
          if [ -n "$VATICAN" ]; then args+=(--vatican "$VATICAN"); fi
          node scripts/discovery/assemble-navigation-source.mjs "${args[@]}"

      - name: Apply explicit reviewed liturgical person links
        run: >-
          node scripts/discovery/apply-reviewed-liturgical-person-links.mjs
          --input staging/navigation/output/navigation-source.json
          --decisions data/liturgical-person-links.reviewed.json
          --output staging/navigation/output/navigation-source-reviewed.json

      - name: Apply explicit reviewed public navigation decisions
        run: >-
          node scripts/discovery/promote-reviewed-navigation.mjs
          --input staging/navigation/output/navigation-source-reviewed.json
          --decisions data/saint-navigation-publication.reviewed.json
          --output staging/navigation/output/navigation-source-public.json

      - name: Audit partial or freeze-ready state
        run: >-
          node scripts/discovery/audit-navigation-readiness.mjs
          --input staging/navigation/output/navigation-source-reviewed.json
          --output staging/navigation/output/readiness.json

      - name: Build deterministic staging exports
        run: >-
          node scripts/discovery/build-navigation-exports.mjs
          --input staging/navigation/output/navigation-source-reviewed.json
          --output staging/navigation/output/exports
          --mode staging
          --locale pt

      - name: Build reviewed public exports
        run: >-
          node scripts/discovery/build-navigation-exports.mjs
          --input staging/navigation/output/navigation-source-public.json
          --output staging/navigation/output/public-exports
          --mode public
          --locale pt

      - name: Resolve approved Portugal v2 product snapshot
        id: portugal_snapshot
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const request=JSON.parse(fs.readFileSync('data/releases/roman-catholic-pt-2026-v2.production-request.json','utf8'));
          if(request.approved!==true||request.approvalScope!=='exact-staging-validated-snapshot-only') throw new Error('Portugal v2 production request is not an exact approved snapshot.');
          if(request.expected?.occurrences!==389||request.expected?.days!==365||request.expected?.labels!==1945) throw new Error('Portugal v2 approved topology mismatch.');
          if(request.safety?.automaticFutureProductionWrites!==false||request.safety?.newStagingSnapshotRequiresNewApproval!==true) throw new Error('Portugal v2 approval safety boundary is invalid.');
          const artifact=request.artifacts?.release;
          if(artifact?.id!==9277632698||artifact?.name!=='portugal-product-v2-31998552573'||artifact?.digest!=='sha256:a7c4bb8664d67bdec9097757072138506bd89a5b1c2698a266b8e82c28828cde') throw new Error('Portugal v2 release artifact identity changed.');
          if(request.stagingWorkflow?.runId!==31998552573||request.stagingWorkflow?.conclusion!=='success'||request.stagingWorkflow?.headSha!==request.sourceMainCommit) throw new Error('Portugal v2 staging provenance changed.');
          const buildSha=artifact.files?.['build.json'];
          if(!/^sha256:[0-9a-f]{64}$/u.test(buildSha??'')) throw new Error('Approved Portugal v2 build digest is missing.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run_id=${request.stagingWorkflow.runId}\nartifact_name=${artifact.name}\nbuild_sha256=${buildSha.slice(7)}\nsource_sha=${request.sourceMainCommit}\n`);
          NODE

      - name: Pull durable approved Portugal v2 snapshot if present
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/pull-latest-stream.mjs
          --stream product/portugal/2026/approved-snapshot/v2
          --destination staging/navigation/portugal-v2-cache
          --allow-missing

      - name: Prepare durable approved Portugal v2 snapshot
        id: portugal_cache
        shell: bash
        run: |
          missing="$(node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('staging/navigation/portugal-v2-cache/consumer-receipt.json','utf8'));process.stdout.write(String(r.missing===true));")"
          mkdir -p staging/navigation/portugal-v2
          if [ "$missing" = 'false' ]; then
            node scripts/archive/extract-safe-tar.mjs --archive staging/navigation/portugal-v2-cache/package.tar.gz --destination staging/navigation/portugal-v2-cache/extracted
            build="$(find staging/navigation/portugal-v2-cache/extracted -type f -name build.json | sort | tail -n 1)"
            test -n "$build"
            cp "$build" staging/navigation/portugal-v2/build.json
            echo 'cached=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cached=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact approved Portugal v2 artifact
        if: steps.portugal_cache.outputs.cached != 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.portugal_snapshot.outputs.artifact_name }}
          path: staging/navigation/portugal-v2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.portugal_snapshot.outputs.run_id }}

      - name: Verify approved Portugal v2 build bytes
        env:
          EXPECTED_BUILD_SHA256: ${{ steps.portugal_snapshot.outputs.build_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ steps.portugal_snapshot.outputs.source_sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const file='staging/navigation/portugal-v2/build.json';
          const bytes=fs.readFileSync(file);
          const sha=crypto.createHash('sha256').update(bytes).digest('hex');
          if(sha!==process.env.EXPECTED_BUILD_SHA256) throw new Error(`Approved Portugal v2 build SHA mismatch: ${sha}`);
          const build=JSON.parse(bytes.toString('utf8'));
          if(build.sourceCommit!==process.env.EXPECTED_SOURCE_SHA) throw new Error('Approved Portugal v2 build source commit mismatch.');
          if(build.build!=='roman-catholic-pt-overlay-v2'||build.productionWriteAllowed!==false) throw new Error('Approved Portugal v2 build crossed its safety boundary.');
          if(build.calendarCoverage?.occurrences!==389||build.calendarCoverage?.coveredDays!==365||build.productReadiness?.labelCount!==1945) throw new Error('Approved Portugal v2 build topology mismatch.');
          if(!Object.values(build.localeCompleteness??{}).every((value)=>value?.completeness===1)) throw new Error('Approved Portugal v2 public locale completeness changed.');
          NODE

      - name: Persist approved Portugal v2 snapshot in Dropbox
        if: steps.portugal_cache.outputs.cached != 'true'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream product/portugal/2026/approved-snapshot/v2
          --source staging/navigation/portugal-v2/build.json
          --source data/releases/roman-catholic-pt-2026-v2.production-request.json

      - name: Build Portugal 2026 saint publication queue
        run: |
          node scripts/product/build-portugal-saint-publication-queue.mjs \
            --calendar staging/navigation/portugal-v2/build.json \
            --navigation staging/navigation/output/navigation-source-reviewed.json \
            --public-navigation staging/navigation/output/navigation-source-public.json \
            --output staging/navigation/output/portugal-2026-publication-queue.json \
            --summary staging/navigation/output/portugal-2026-publication-queue-summary.json

      - name: Build Portugal P0 identity review pack
        run: |
          node scripts/product/build-portugal-p0-review-pack.mjs \
            --queue staging/navigation/output/portugal-2026-publication-queue.json \
            --navigation staging/navigation/output/navigation-source-reviewed.json \
            --output staging/navigation/output/portugal-2026-p0-review-pack.json \
            --summary staging/navigation/output/portugal-2026-p0-review-pack-summary.json

      - name: Archive canonical navigation source in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream navigation/saints/v1/source
          --source staging/navigation/output/navigation-source.json
          --source staging/navigation/output/navigation-source-reviewed.json
          --source staging/navigation/output/navigation-source-public.json
          --source staging/navigation/output/readiness.json

      - name: Archive Portugal saint publication queue in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream product/portugal/2026/saint-publication-queue/v1
          --source staging/navigation/output/portugal-2026-publication-queue.json
          --source staging/navigation/output/portugal-2026-publication-queue-summary.json
          --source data/releases/roman-catholic-pt-2026-v2.production-request.json

      - name: Archive Portugal P0 review pack in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream product/portugal/2026/p0-review-pack/v1
          --source staging/navigation/output/portugal-2026-p0-review-pack.json
          --source staging/navigation/output/portugal-2026-p0-review-pack-summary.json
          --source staging/navigation/output/portugal-2026-publication-queue-summary.json

      - name: Archive staging export bundle in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream navigation/saints/v1/exports/pt
          --source staging/navigation/output/exports
          --source staging/navigation/output/readiness.json

      - name: Archive reviewed public export bundle in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/archive-to-dropbox.mjs
          --stream navigation/saints/v1/public/pt
          --source staging/navigation/output/public-exports
          --source data/saint-navigation-publication.reviewed.json

      - name: Publish readable current readiness in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/publish-current-json.mjs
          --source staging/navigation/output/readiness.json
          --destination /current/navigation/saints/v1/readiness.json

      - name: Publish readable current public manifest in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/publish-current-json.mjs
          --source staging/navigation/output/public-exports/manifest.json
          --destination /current/navigation/saints/v1/public-manifest.json

      - name: Publish readable Portugal publication queue summary in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/publish-current-json.mjs
          --source staging/navigation/output/portugal-2026-publication-queue-summary.json
          --destination /current/product/portugal/2026/saint-publication-queue-summary.json

      - name: Publish readable Portugal P0 review summary in Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: >-
          node scripts/dropbox/publish-current-json.mjs
          --source staging/navigation/output/portugal-2026-p0-review-pack-summary.json
          --destination /current/product/portugal/2026/p0-review-pack-summary.json

      - name: Upload bounded publication review evidence
        uses: actions/upload-artifact@v7
        with:
          name: portugal-2026-publication-review-${{ github.run_id }}
          path: |
            staging/navigation/output/portugal-2026-publication-queue.json
            staging/navigation/output/portugal-2026-publication-queue-summary.json
            staging/navigation/output/portugal-2026-p0-review-pack.json
            staging/navigation/output/portugal-2026-p0-review-pack-summary.json
          if-no-files-found: error
          retention-days: 30
