name: One-time security lock refresh

# Attempt 3: patched dependencies and valid calendar staging fixture.
on:
  push:
    branches: [agent/architecture-stabilization]
    paths:
      - '.github/workflows/refresh-security-lock-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-security-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v6
        with:
          ref: agent/architecture-stabilization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Regenerate lockfile from scoped overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact dependency tree
        run: npm ci --include=optional

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Run application quality gate
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run cloudflare:build

      - name: Commit validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already matches the scoped overrides.'
            exit 0
          fi
          git config user.name 'santosdodia-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): refresh patched dependency lockfile'
          git fetch origin agent/architecture-stabilization
          git rebase origin/agent/architecture-stabilization
          git push origin HEAD:agent/architecture-stabilization
