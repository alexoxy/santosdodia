name: Provision D1 staging once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/d1-staging-provision-once.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: d1-staging-provision-once
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: d1-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Provision or reuse EU staging database
        run: node scripts/manage-d1-staging.mjs provision --output reports/d1-staging-provision.json

      - name: Upload provision receipt
        uses: actions/upload-artifact@v6
        with:
          name: d1-staging-provision-receipt
          path: reports/d1-staging-provision.json
          if-no-files-found: error
          retention-days: 30

      - name: Record staging receipt in tracker
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('reports/d1-staging-provision.json', 'utf8'));
          const database = receipt.database ?? {};
          const body = [
            '### D1 staging provision receipt',
            '',
            `- Status: ${receipt.created ? 'created' : 'reused'}`,
            `- Database: \`${database.name ?? 'unknown'}\``,
            `- Database ID: \`${database.uuid ?? 'unknown'}\``,
            `- Jurisdiction: \`${database.jurisdiction ?? 'unknown'}\``,
            `- Completed: ${receipt.completedAt}`,
            '',
            'No migrations or calendar records were applied by this run.'
          ].join('\n');
          fs.writeFileSync('/tmp/d1-staging-comment.md', body, 'utf8');
          NODE
          gh issue comment 10 --repo "$GITHUB_REPOSITORY" --body-file /tmp/d1-staging-comment.md
