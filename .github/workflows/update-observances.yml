name: Prepare observance staging package

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observance-staging-package
  cancel-in-progress: false

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Audit repository hygiene
        run: npm run repo:audit

      - name: Synchronise sources into an isolated staging directory
        shell: bash
        run: |
          set -euo pipefail
          npm run data:sync
          mkdir -p staging/observances
          mv data/generated/source-snapshot.json staging/observances/source-snapshot.json

      - name: Build compact runtime candidate
        run: node scripts/build-runtime-fallback.mjs staging/observances/source-snapshot.json staging/observances/runtime-fallback.json

      - name: Audit curated data against the candidate
        env:
          RUNTIME_SNAPSHOT_PATH: staging/observances/runtime-fallback.json
        run: npm run data:audit

      - name: Audit claim-specific editorial evidence
        run: npm run claims:audit

      - name: Validate application build
        run: npm run build

      - name: Write provisional staging manifest
        shell: bash
        run: |
          cat > staging/observances/STAGING_MANIFEST.json <<MANIFEST
          {
            "schemaVersion": 1,
            "workflowRun": "${GITHUB_RUN_ID}",
            "sourceCommit": "${GITHUB_SHA}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "provisional",
            "promotionAllowed": false,
            "nextGate": "Archive in Dropbox, verify provenance and promote transactionally"
          }
          MANIFEST

      - name: Upload bounded staging package
        uses: actions/upload-artifact@v6
        with:
          name: observance-staging-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: staging/observances/
