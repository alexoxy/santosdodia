name: OSINT Wikidata pilot archive

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osint-wikidata-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-only-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OSINT_WIKIDATA_PAGE_SIZE: "500"
      OSINT_WIKIDATA_MAX_PAGES: "1"
      OSINT_WIKIDATA_DELAY_MS: "1000"
    steps:
      - name: Checkout isolated pilot branch
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate OSINT registry and policy gate
        run: npm run osint:registry-audit

      - name: Run bounded Wikidata archive-only pilot
        run: npm run osint:dump

      - name: Verify archive-only output limits
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join('data', 'osint', 'runs', 'wikidata');
          const runDirs = fs.readdirSync(root).map((name) => path.join(root, name)).filter((entry) => fs.statSync(entry).isDirectory());
          if (runDirs.length !== 1) throw new Error(`Expected exactly one run directory, found ${runDirs.length}`);
          const runDir = runDirs[0];
          const summary = JSON.parse(fs.readFileSync(path.join(runDir, 'summary.json'), 'utf8'));
          if (summary.mode !== 'archive-only' || summary.publish !== false) throw new Error('Pilot output is not archive-only with publish=false.');
          if (summary.status !== 'fetched') throw new Error(`Pilot status is ${summary.status}.`);
          if (!Number.isInteger(summary.totalBindings) || summary.totalBindings < 1 || summary.totalBindings > 500) {
            throw new Error(`Unexpected binding count: ${summary.totalBindings}`);
          }
          let totalBytes = 0;
          for (const name of fs.readdirSync(runDir)) totalBytes += fs.statSync(path.join(runDir, name)).size;
          if (totalBytes > 1073741824) throw new Error(`Pilot exceeds 1 GiB: ${totalBytes} bytes.`);
          fs.writeFileSync('pilot-result.json', `${JSON.stringify({ runDir, totalBytes, ...summary }, null, 2)}\n`);
          console.log(JSON.stringify({ runDir, totalBytes, totalBindings: summary.totalBindings, status: summary.status }, null, 2));
          NODE

      - name: Upload immutable pilot archive
        uses: actions/upload-artifact@v4
        with:
          name: santosdodia-wikidata-pilot-${{ github.run_id }}
          path: |
            data/osint/runs/wikidata/
            pilot-result.json
          if-no-files-found: error
          retention-days: 7
