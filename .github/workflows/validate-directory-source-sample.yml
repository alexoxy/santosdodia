name: Validate ecclesiastical source samples

on:
  push:
    branches:
      - agent/global-leaders-directory
    paths:
      - '.github/workflows/validate-directory-source-sample.yml'

permissions:
  contents: read
  issues: write

jobs:
  source-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Validate Catholic-Hierarchy Portugal sample
        run: npm run leaders:sync -- --source=catholic-hierarchy --country=pt --max-countries=1 --dry-run

      - name: Validate GCatholic current event sample
        run: npm run leaders:sync -- --source=gcatholic --dry-run

      - name: Record source adapter validation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `✅ Bounded source samples passed for \`${context.sha}\`: Catholic-Hierarchy Portugal and GCatholic current events were fetched through the robots-aware, rate-limited adapters without publishing data.`
            })
