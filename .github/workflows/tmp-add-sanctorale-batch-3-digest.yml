name: Temporary add Sanctorale batch 3 digest

on:
  push:
    branches:
      - migration/sanctorale-founders-missionary-review-20260831
    paths:
      - '.github/workflows/tmp-add-sanctorale-batch-3-digest.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: migration/sanctorale-founders-missionary-review-20260831

      - name: Add immutable batch 3 digest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs';
          const text = fs.readFileSync(path, 'utf8');
          const from = "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-2.json', '167062ead74a3821b62ea6c45e0e06a00b6ed4e9cffdfe4573286535d01a3b6b']\n]);";
          const to = "  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-2.json', '167062ead74a3821b62ea6c45e0e06a00b6ed4e9cffdfe4573286535d01a3b6b'],\n  ['roman-catholic-pt-2026-v2.sanctorale-review-batch-3.json', '3a125eb283da6ca7be7b699109257887361f516f060e44ee5f8f98b97e90e9dc']\n]);";
          if ((text.split(from).length - 1) !== 1) throw new Error('Digest allowlist anchor changed unexpectedly.');
          fs.writeFileSync(path, text.replace(from, to), 'utf8');
          NODE

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-add-sanctorale-batch-3-digest.yml

      - name: Commit reviewed gate update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vault/test-portugal-v2-sanctorale-review-packs.mjs .github/workflows/tmp-add-sanctorale-batch-3-digest.yml
          git commit -m 'Allowlist reviewed Sanctorale batch 3 digest'
          git push origin HEAD:migration/sanctorale-founders-missionary-review-20260831
